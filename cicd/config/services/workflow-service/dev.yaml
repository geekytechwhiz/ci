service:
  name: workflow-service
  root: workflow

source:
  repository: MyvitalRx/Cf-testing
  branch: dev
  connectionArn: ""
  ciPath: workflow/ci

deployment:
  data: true
  infrastructure: true
  application: true

data:
  enabled: true
  type: dynamodb
  logicalId: WorkflowTable
  tableName: workflow-dev-db
  ownershipTags:
    Service: workflow-service
    Purpose: WorkflowTable
    ManagedBy: serverless

naming:
  resourceNamePrefix: nvdev-use1-mvx

features:
  dynamodb: true
  sqs: true
  lambda: true
  apiGateway: true

ssm:
  prefix: /nvdev-use1-mvx/workflow-service
  required:
    - TABLE_NAME
    - TABLE_ARN
    - STREAM_ARN
    - SQS_QUEUE_URL
    - SQS_QUEUE_ARN
    - EVENT_BUS_NAME
    - EVENT_BUS_ARN

application:
  healthCheckPath: /health
  apiBaseUrlParameter: /nvdev-use1-mvx/workflow-service/api-base-url
  healthResponseContains: '"status": "healthy"'
  buildProjectName: ""

changeDetection:
  data:
    - workflow/data/**
  infrastructure:
    - workflow/infra/**
  application:
    - workflow/src/**
    - workflow/serverless.yml
    - workflow/config/**
    - workflow/esbuild-plugins.js
    - infra/serverless/**
    - libs/**
  ci:
    - workflow/ci/**
    - workflow/package.json