# Shared environment configuration for all services in `dev`.
# Replace REPLACE_ME_* values before deploying any pipeline.
environment:
  name: dev
  awsRegion: ap-south-1

github:
  # Official organization CodeConnections ARN (must be AVAILABLE, not PENDING).
  connectionArn: REPLACE_ME_CODECONNECTIONS_ARN

artifacts:
  # CodePipeline internal artifact store (Source/Build zips). Not the deployment bucket.
  pipelineBucket: REPLACE_ME_CODEPIPELINE_ARTIFACT_BUCKET
  # Centralized immutable deployment artifacts: <service>/<commit-sha>/...
  deploymentBucket: REPLACE_ME_DEPLOYMENT_ARTIFACT_BUCKET
  # Optional SSE-KMS for the CodePipeline artifact store. Empty = S3-managed AES256.
  kmsKeyArn: ""

codeBuild:
  image: aws/codebuild/standard:7.0
