# Production-ready generic AWS CodePipeline V2 template
#
# Design principles:
# - Service-agnostic: ServiceName, repository, CI path and optional contracts are parameters.
# - GitHub uses an AWS CodeConnections connection authorized for the official organization.
# - No personal GitHub account/connection is embedded in the template.
# - Data / recovery / infra / app execution is driven by Build-exported variables.
# - Artifact objects are commit-scoped under <ServiceName>/<commit-sha>/.
# - Stack, SSM, IAM and resource names are derived from Stage + ServiceName.
# - CodeBuild uses inline BuildSpecs that resolve a shared cicd framework
#   (monorepo FrameworkPath or S3 ${ArtifactBucket}/${FrameworkPrefix}/pipeline.tgz).
#
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Generic service CI/CD pipeline. One CodePipeline V2 (QUEUED): Source → Build →
  Deploy-Data → Approve-Data-Recovery → Recover-Data → Deploy-Infra → Validate-SSM →
  Deploy-App → Smoke-Test → Record-Deployment. Approve-Data-Recovery and Recover-Data
  SKIP unless #{DataDeploymentVariables.RECOVERY_REQUIRED}=true. Data stack owns
  DynamoDB + data SSM. Infra stack owns SQS + infra SSM. Application stack name stays
  {stage}-${ServiceName}. Deploy as stack {stage}-${ServiceName}-cicd.
  Deployment artifacts live in ArtifactBucket under ${ServiceName}/<commit-sha>/.
  Deploy-Data, Deploy-Infra, Deploy-App, and Smoke-Test skip when the matching
  BuildVariables flag is false (BeforeEntry VariableCheck, Result SKIP).
  Validate-SSM always runs. Record-Deployment writes
  /${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT.

Parameters:
  ServiceName:
    Type: String
    Description: Logical service name used to derive pipeline, role, stack, SSM, artifact and CodeBuild resource names.
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,62}$'

  Stage:
    Type: String
    AllowedValues: [dev, stg, prd]
    Description: Deployment stage (dev, stg, or prd).

  PipelineName:
    Type: String
    Description: >
      CodePipeline name. Required with no broken default — deploy script should pass
      a derived value such as {Stage}-{ServiceName}-pipeline.
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'

  CiPath:
    Type: String
    Description: Path to the service CI packaging hooks directory in the source repository.
    Default: ci

  FrameworkPath:
    Type: String
    Description: Monorepo path to the cicd pipeline framework (scripts/). Prefer this when present in source.
    Default: cicd/pipeline

  FrameworkPrefix:
    Type: String
    Description: >
      S3 prefix under ArtifactBucket for the packaged framework bundle (pipeline.tgz).
      Deploy script should pin a content SHA (e.g. cicd-framework/<sha>).
    Default: cicd-framework/latest

  DataTableName:
    Type: String
    Default: ''
    Description: Optional data table name. Leave empty to use ${ServiceName}-${Stage} at runtime.

  DataLogicalId:
    Type: String
    Default: PrimaryTable
    Description: CloudFormation logical ID of the primary DynamoDB table in the data stack.

  ApiBaseUrlParameter:
    Type: String
    Default: ''
    Description: Optional full SSM parameter path containing the service API base URL for smoke tests.

  HealthCheckPath:
    Type: String
    Default: /health
    Description: HTTP health endpoint used by the generic smoke test.

  HealthResponseContains:
    Type: String
    Default: '"status": "healthy"'
    Description: Substring that must appear in a successful health response body.

  RequiredSsmParameters:
    Type: String
    Default: ''
    Description: Comma-separated list of required SSM parameter leaf names under SSM_PREFIX (e.g. TABLE_NAME,TABLE_ARN).

  ArtifactBucketName:
    Type: String
    Description: Existing CodePipeline artifact store bucket (internal pipeline artifacts). Not the deployment artifact bucket.

  ArtifactBucket:
    Type: String
    Description: Centralized environment deployment artifact bucket (commit-scoped packages + cicd framework bundle). Required — no default.

  BuildProjectName:
    Type: String
    Default: ''
    Description: Existing package-only CodeBuild project name. Leave empty to create ${Stage}-${ServiceName}-build.

  GitHubConnectionArn:
    Type: String
    Description: AWS CodeConnections ARN authorized for the official GitHub organization/repository.

  GitHubFullRepositoryId:
    Type: String
    Description: GitHub repository in owner/repository format.

  GitHubBranch:
    Type: String
    Description: GitHub branch to track for Source.

  CodeBuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    Description: CodeBuild container image.

  EnableData:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When false, Build always exports DEPLOY_DATA=false (Deploy-Data/Recover stages skip).

  EnableInfra:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When false, Build always exports DEPLOY_INFRA=false.

  EnableApp:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When false, Build always exports DEPLOY_APP=false (Smoke-Test also skips).

  EnableDynamoDb:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When false, omit DynamoDB permissions from the CFN deploy role.

  EnableSqs:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When false, omit SQS permissions from the CFN deploy role.

  EnableLambda:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When false, omit Lambda permissions from the CFN deploy role.

  EnableApiGateway:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When false, omit API Gateway permissions from the CFN deploy role.

  OwnershipTagService:
    Type: String
    Default: ''
    Description: Expected DynamoDB ownership tag Service value. Empty falls back to ServiceName.

  OwnershipTagPurpose:
    Type: String
    Default: primaryDataTable
    Description: Expected DynamoDB ownership tag Purpose value used by data preflight/recovery.

Conditions:
  HasApiBaseUrlParameter: !Not [!Equals [!Ref ApiBaseUrlParameter, '']]
  HasDataTableName: !Not [!Equals [!Ref DataTableName, '']]
  HasOwnershipTagService: !Not [!Equals [!Ref OwnershipTagService, '']]
  HasExternalBuildProject: !Not [!Equals [!Ref BuildProjectName, '']]
  CreateBuildProject: !Equals [!Ref BuildProjectName, '']
  EnableDataLayer: !Equals [!Ref EnableData, 'true']
  EnableInfraLayer: !Equals [!Ref EnableInfra, 'true']
  EnableAppLayer: !Equals [!Ref EnableApp, 'true']
  EnableDynamoDbFeature: !Equals [!Ref EnableDynamoDb, 'true']
  EnableSqsFeature: !Equals [!Ref EnableSqs, 'true']
  EnableLambdaFeature: !Equals [!Ref EnableLambda, 'true']
  EnableApiGatewayFeature: !Equals [!Ref EnableApiGateway, 'true']

Resources:
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Stage}-${ServiceName}-pipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage
        - Key: Stack
          Value: cicd
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
              - Sid: StartCodeBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:StopBuild
                Resource:
                  - !If
                    - CreateBuildProject
                    - !GetAtt BuildProject.Arn
                    - !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${BuildProjectName}'
                  - !GetAtt DeployDataProject.Arn
                  - !GetAtt RecoverDataProject.Arn
                  - !GetAtt DeployInfraProject.Arn
                  - !GetAtt DeployAppProject.Arn
                  - !GetAtt ValidateSsmProject.Arn
                  - !GetAtt SmokeTestProject.Arn
                  - !GetAtt RecordDeploymentProject.Arn
              - Sid: CloudFormationDeployActions
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                  - cloudformation:DeleteStack
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-infra/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/${Stage}-${ServiceName}*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/${Stage}-${ServiceName}-data*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/${Stage}-${ServiceName}-infra*'
              - Sid: ValidateTemplateUnscoped
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: DenyCloudFormationImport
                Effect: Deny
                Action: cloudformation:*
                Resource: '*'
                Condition:
                  ForAnyValue:StringLike:
                    cloudformation:ImportResourceTypes:
                      - '*'
              - Sid: PassCfnDeployRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationDeployRole.Arn
              - Sid: UseGitHubConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn
                Condition:
                  StringEquals:
                    codeconnections:FullRepositoryId: !Ref GitHubFullRepositoryId

  BuildRole:
    Type: AWS::IAM::Role
    Condition: CreateBuildProject
    Properties:
      RoleName: !Sub '${Stage}-${ServiceName}-build-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage
        - Key: Stack
          Value: cicd
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Sid: ReadLastDeployedCommit
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/${ServiceName}/*'
              - Sid: PipelineArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
              - Sid: PipelineArtifactBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
              - Sid: DeploymentArtifactObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetObjectTagging
                  - s3:PutObjectTagging
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ServiceName}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${FrameworkPrefix}/*'
              - Sid: DeploymentArtifactList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}'
              - Sid: DenyOverwriteProtectionHint
                Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ServiceName}/*'

  CloudFormationDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Stage}-${ServiceName}-cfn-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage
        - Key: Stack
          Value: cicd
      Policies:
        - PolicyName: cfn-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EnvironmentArtifactBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetEncryptionConfiguration
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}'
              - Sid: EnvironmentArtifactBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ServiceName}/*'
              - Sid: PipelineArtifactTemplateList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
              - Sid: PipelineArtifactTemplateObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
              - Sid: SsmContract
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:AddTagsToResource
                  - ssm:DeleteParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/${ServiceName}/*'
              - Sid: SharedSsmReads
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*'
              - !If
                - EnableDynamoDbFeature
                - Sid: DynamoDbData
                  Effect: Allow
                  Action:
                    - dynamodb:CreateTable
                    - dynamodb:UpdateTable
                    - dynamodb:DescribeTable
                    - dynamodb:DescribeTimeToLive
                    - dynamodb:UpdateTimeToLive
                    - dynamodb:ListTagsOfResource
                    - dynamodb:TagResource
                    - dynamodb:UntagResource
                    - dynamodb:UpdateContinuousBackups
                    - dynamodb:DescribeContinuousBackups
                    - dynamodb:DescribeKinesisStreamingDestination
                  Resource:
                    - !If
                      - HasDataTableName
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTableName}'
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}'
                    - !If
                      - HasDataTableName
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTableName}/index/*'
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}/index/*'
                    - !If
                      - HasDataTableName
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTableName}/stream/*'
                      - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}/stream/*'
                - !Ref AWS::NoValue
              - !If
                - EnableDynamoDbFeature
                - Sid: DynamoDbListStreams
                  Effect: Allow
                  Action: dynamodb:ListStreams
                  Resource: '*'
                - !Ref AWS::NoValue
              - !If
                - EnableSqsFeature
                - Sid: Sqs
                  Effect: Allow
                  Action:
                    - sqs:CreateQueue
                    - sqs:DeleteQueue
                    - sqs:GetQueueAttributes
                    - sqs:GetQueueUrl
                    - sqs:SetQueueAttributes
                    - sqs:TagQueue
                    - sqs:UntagQueue
                    - sqs:ListQueueTags
                  Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${Stage}-${ServiceName}-*'
                - !Ref AWS::NoValue
              - !If
                - EnableLambdaFeature
                - Sid: Lambda
                  Effect: Allow
                  Action:
                    - lambda:CreateFunction
                    - lambda:UpdateFunctionCode
                    - lambda:UpdateFunctionConfiguration
                    - lambda:DeleteFunction
                    - lambda:GetFunction
                    - lambda:GetFunctionConfiguration
                    - lambda:ListTags
                    - lambda:TagResource
                    - lambda:UntagResource
                    - lambda:AddPermission
                    - lambda:RemovePermission
                    - lambda:GetPolicy
                    - lambda:PublishVersion
                    - lambda:CreateEventSourceMapping
                    - lambda:UpdateEventSourceMapping
                    - lambda:DeleteEventSourceMapping
                    - lambda:GetEventSourceMapping
                    - lambda:ListEventSourceMappings
                  Resource: '*'
                - !Ref AWS::NoValue
              - !If
                - EnableLambdaFeature
                - Sid: IamLambdaRoles
                  Effect: Allow
                  Action:
                    - iam:CreateRole
                    - iam:GetRole
                    - iam:DeleteRole
                    - iam:PassRole
                    - iam:PutRolePolicy
                    - iam:GetRolePolicy
                    - iam:DeleteRolePolicy
                    - iam:AttachRolePolicy
                    - iam:DetachRolePolicy
                    - iam:TagRole
                    - iam:UntagRole
                    - iam:ListRoleTags
                    - iam:ListAttachedRolePolicies
                    - iam:ListRolePolicies
                    - iam:UpdateAssumeRolePolicy
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Stage}-${ServiceName}*'
                    - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ServiceName}*'
                - !Ref AWS::NoValue
              - !If
                - EnableApiGatewayFeature
                - Sid: ApiGateway
                  Effect: Allow
                  Action:
                    - apigateway:*
                  Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::*'
                - !Ref AWS::NoValue
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'

  CloudFormationRecoverDataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Stage}-${ServiceName}-cfn-recover-data-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage
        - Key: Stack
          Value: cicd
        - Key: Purpose
          Value: DataRecovery
      Policies:
        - PolicyName: cfn-recover-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDataPackagedTemplate
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ServiceName}/*/data/packaged.yaml'
              - Sid: ImportExistingDataTable
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:DescribeKinesisStreamingDestination
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:UpdateContinuousBackups
                Resource:
                  - !If
                    - HasDataTableName
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTableName}'
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}'
                  - !If
                    - HasDataTableName
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTableName}/index/*'
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}/index/*'
                  - !If
                    - HasDataTableName
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTableName}/stream/*'
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}/stream/*'
              - Sid: ListStreamsForImport
                Effect: Allow
                Action: dynamodb:ListStreams
                Resource: '*'
              - Sid: RestoreDataSsmAfterImport
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:AddTagsToResource
                  - ssm:DeleteParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/${ServiceName}/TABLE_NAME'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/${ServiceName}/TABLE_ARN'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/${ServiceName}/STREAM_ARN'
              - Sid: DenyDeleteTable
                Effect: Deny
                Action: dynamodb:DeleteTable
                Resource: '*'
              - Sid: DenyS3ObjectDelete
                Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: '*'
              - Sid: DenyUnrestrictedIamChanges
                Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:CreateUser
                  - iam:DeleteUser
                  - iam:CreateAccessKey
                  - iam:PutUserPolicy
                  - iam:AttachUserPolicy
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:PassRole
                Resource: '*'

  DeployDataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Stage}-${ServiceName}-deploy-data-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage
        - Key: Stack
          Value: cicd
      Policies:
        - PolicyName: deploy-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Sid: CloudFormationDataStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'
              - Sid: DescribeAndValidateUnscoped
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListChangeSets
                Resource: '*'
              - Sid: PassCfnDeployRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationDeployRole.Arn
              - Sid: DescribeTableForPreflight
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
