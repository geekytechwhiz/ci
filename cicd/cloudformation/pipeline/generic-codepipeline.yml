                    echo "Using monorepo framework at ${!CICD_FRAMEWORK_DIR}"
                  else
                    mkdir -p /tmp/cicd-framework
                    aws s3 cp "s3://${ArtifactBucket}/${FrameworkPrefix}/pipeline.tgz" /tmp/pipeline.tgz
                    tar -xzf /tmp/pipeline.tgz -C /tmp/cicd-framework
                    export CICD_FRAMEWORK_DIR=/tmp/cicd-framework
                    echo "Downloaded framework to ${!CICD_FRAMEWORK_DIR}"
                  fi
                  test -d "${!CICD_FRAMEWORK_DIR}/scripts"
                  chmod +x "${!CICD_FRAMEWORK_DIR}/scripts/"*.sh || true
            build:
              commands:
                - bash "${!CICD_FRAMEWORK_DIR}/scripts/run-record-deployment.sh"
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref CodeBuildImage
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: STAGE
            Type: PLAINTEXT
            Value: !Ref Stage
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName
          - Name: AWS_REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: ARTIFACT_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactBucket
          - Name: CI_PATH
            Type: PLAINTEXT
            Value: !Ref CiPath
          - Name: FRAMEWORK_PATH
            Type: PLAINTEXT
            Value: !Ref FrameworkPath
          - Name: FRAMEWORK_PREFIX
            Type: PLAINTEXT
            Value: !Ref FrameworkPrefix
          - Name: SSM_PREFIX
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}'
          - Name: LAST_DEPLOYED_COMMIT_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT'
          - Name: REQUIRED_SSM_PARAMETERS
            Type: PLAINTEXT
            Value: !Ref RequiredSsmParameters
          - Name: DATA_LOGICAL_ID
            Type: PLAINTEXT
            Value: !Ref DataLogicalId
          - Name: DATA_TABLE_NAME
            Type: PLAINTEXT
            Value: !Ref DataTableName
          - Name: OWNERSHIP_TAG_SERVICE
            Type: PLAINTEXT
            Value: !If
              - HasOwnershipTagService
              - !Ref OwnershipTagService
              - !Ref ServiceName
          - Name: OWNERSHIP_TAG_PURPOSE
            Type: PLAINTEXT
            Value: !Ref OwnershipTagPurpose
          - Name: ENABLE_DATA
            Type: PLAINTEXT
            Value: !Ref EnableData
          - Name: ENABLE_INFRA
            Type: PLAINTEXT
            Value: !Ref EnableInfra
          - Name: ENABLE_APP
            Type: PLAINTEXT
            Value: !Ref EnableApp
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage


  ServicePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref PipelineName
      PipelineType: V2
      ExecutionMode: QUEUED
      RestartExecutionOnUpdate: false
      RoleArn: !GetAtt PipelineRole.Arn
      Variables:
        - Name: ArtifactBucket
          DefaultValue: !Ref ArtifactBucket
          Description: Centralized environment artifact bucket. CodeBuild receives ARTIFACT_BUCKET=#{variables.ArtifactBucket}.
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              RunOrder: 1
              OutputArtifacts:
                - Name: SourceArtifact
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubFullRepositoryId
                BranchName: !Ref GitHubBranch
                DetectChanges: 'true'
                OutputArtifactFormat: CODE_ZIP

        - Name: Build
          Actions:
            - Name: Build
              Namespace: BuildVariables
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !If
                  - CreateBuildProject
                  - !Ref BuildProject
                  - !Ref BuildProjectName
                PrimarySource: SourceArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"SERVICE_NAME","value":"${ServiceName}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"ENABLE_DATA","value":"${EnableData}","type":"PLAINTEXT"},{"name":"ENABLE_INFRA","value":"${EnableInfra}","type":"PLAINTEXT"},{"name":"ENABLE_APP","value":"${EnableApp}","type":"PLAINTEXT"},{"name":"CI_PATH","value":"${CiPath}","type":"PLAINTEXT"},{"name":"LAST_DEPLOYED_COMMIT_PARAM","value":"/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT","type":"PLAINTEXT"}]'
              # Namespace BuildVariables exposes DEPLOY_DATA / DEPLOY_INFRA /
              # DEPLOY_APP / CURRENT_COMMIT from CodeBuild exported-variables.
              # Later stages consume #{BuildVariables.DEPLOY_*} via BeforeEntry
              # VariableCheck (Result SKIP) and #{BuildVariables.CURRENT_COMMIT}
              # for artifact fetch and Record-Deployment.
              # VariableCheck treats an empty resolved value as a configuration
              # error ("Variable cannot be empty"), so Build post_build must
              # source deployment-decision.env into the CodeBuild parent shell.

        - Name: Deploy-Data
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: DeployDataVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{BuildVariables.DEPLOY_DATA}'
          Actions:
            - Name: DeployData
              Namespace: DataDeploymentVariables
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
              OutputArtifacts:
                - Name: DataPreflightArtifact
              Configuration:
                ProjectName: !Ref DeployDataProject
                PrimarySource: BuildArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"}]'
              # Namespace DataDeploymentVariables exposes DATA_ACTION /
              # DATA_REASON / RECOVERY_REQUIRED / RECOVERY_CHANGE_SET_NAME /
              # RECOVERY_STACK_NAME / RECOVERY_TABLE_NAME / RECOVERY_STAGE /
              # CURRENT_COMMIT from CodeBuild exported-variables.
              # Approve-Data-Recovery and Recover-Data BeforeEntry VariableCheck
              # encodes #{DataDeploymentVariables.RECOVERY_REQUIRED} == 'true':
              # EQ true RUNS the stage; any other value fails the rule and SKIP
              # engages. CREATE/UPDATE export RECOVERY_REQUIRED=false.

        - Name: Approve-Data-Recovery
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: ApproveDataRecoveryVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{DataDeploymentVariables.RECOVERY_REQUIRED}'
          Actions:
            - Name: ApproveDataRecovery
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              RunOrder: 1
              Configuration:
                CustomData: !Sub 'Service: ${ServiceName}. Stage: ${Stage}. Commit: #{BuildVariables.CURRENT_COMMIT}. Action: #{DataDeploymentVariables.DATA_ACTION}. Existing data resource: #{DataDeploymentVariables.RECOVERY_TABLE_NAME}. Target stack: #{DataDeploymentVariables.RECOVERY_STACK_NAME}. Change set: #{DataDeploymentVariables.RECOVERY_CHANGE_SET_NAME}. Recovery: import existing DynamoDB table into CloudFormation. Safety: table will NOT be deleted or recreated. Approve only if this is the expected production table.'

        - Name: Recover-Data
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: RecoverDataVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{DataDeploymentVariables.RECOVERY_REQUIRED}'
          Actions:
            - Name: RecoverData
              Namespace: DataRecoveryVariables
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
                - Name: DataPreflightArtifact
              Configuration:
                ProjectName: !Ref RecoverDataProject
                PrimarySource: BuildArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"},{"name":"DATA_ACTION","value":"#{DataDeploymentVariables.DATA_ACTION}","type":"PLAINTEXT"},{"name":"RECOVERY_REQUIRED","value":"#{DataDeploymentVariables.RECOVERY_REQUIRED}","type":"PLAINTEXT"},{"name":"RECOVERY_CHANGE_SET_NAME","value":"#{DataDeploymentVariables.RECOVERY_CHANGE_SET_NAME}","type":"PLAINTEXT"},{"name":"RECOVERY_STACK_NAME","value":"#{DataDeploymentVariables.RECOVERY_STACK_NAME}","type":"PLAINTEXT"},{"name":"RECOVERY_TABLE_NAME","value":"#{DataDeploymentVariables.RECOVERY_TABLE_NAME}","type":"PLAINTEXT"},{"name":"CHANGE_SET_NAME","value":"#{DataDeploymentVariables.RECOVERY_CHANGE_SET_NAME}","type":"PLAINTEXT"},{"name":"DATA_RECOVERY_PHASE","value":"execute","type":"PLAINTEXT"},{"name":"RECOVERY_STATUS","value":"APPROVAL_GRANTED","type":"PLAINTEXT"}]'

        - Name: Deploy-Infra
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: DeployInfraVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{BuildVariables.DEPLOY_INFRA}'
          Actions:
            - Name: DeployInfra
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref DeployInfraProject
                PrimarySource: BuildArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"}]'

        - Name: Validate-SSM
          Actions:
            - Name: ValidateSSM
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref ValidateSsmProject
                PrimarySource: BuildArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"REQUIRED_SSM_PARAMETERS","value":"${RequiredSsmParameters}","type":"PLAINTEXT"},{"name":"SSM_PREFIX","value":"/${Stage}/${ServiceName}","type":"PLAINTEXT"}]'

        - Name: Deploy-App
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: DeployAppVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{BuildVariables.DEPLOY_APP}'
          Actions:
            - Name: DeployApp
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref DeployAppProject
                PrimarySource: BuildArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"STACK_NAME","value":"${Stage}-${ServiceName}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"}]'

        - Name: Smoke-Test
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: SmokeTestVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{BuildVariables.DEPLOY_APP}'
          Actions:
            - Name: SmokeTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref SmokeTestProject
                PrimarySource: BuildArtifact
                # HEALTH_RESPONSE_CONTAINS stays on SmokeTestProject env (may contain quotes).
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"API_BASE_URL_PARAMETER","value":"${ApiBaseUrlParameter}","type":"PLAINTEXT"},{"name":"HEALTH_CHECK_PATH","value":"${HealthCheckPath}","type":"PLAINTEXT"}]'

        - Name: Record-Deployment
          Actions:
            - Name: RecordDeployment
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: SourceArtifact
              Configuration:
                ProjectName: !Ref RecordDeploymentProject
                PrimarySource: SourceArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"},{"name":"LAST_DEPLOYED_COMMIT_PARAM","value":"/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT","type":"PLAINTEXT"}]'

Outputs:
  PipelineName:
    Description: CodePipeline name
    Value: !Ref ServicePipeline
  PipelineArn:
    Description: CodePipeline ARN
    Value: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${PipelineName}'
  DataStackName:
    Description: Derived data stack name
    Value: !Sub '${Stage}-${ServiceName}-data'
  InfraStackName:
    Description: Derived infrastructure stack name
    Value: !Sub '${Stage}-${ServiceName}-infra'
  AppStackName:
    Description: Derived application stack name
    Value: !Sub '${Stage}-${ServiceName}'
  CicdStackName:
    Description: Expected CICD stack name for this template
    Value: !Sub '${Stage}-${ServiceName}-cicd'
  LastDeployedCommitParameter:
    Description: SSM parameter written by Record-Deployment
    Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT'
  SsmPrefix:
    Description: Service SSM parameter prefix
    Value: !Sub '/${Stage}/${ServiceName}'
  DataTemplatePath:
    Description: Immutable data packaged template path pattern
    Value: !Sub 's3://${ArtifactBucket}/${ServiceName}/<commit-sha>/data/packaged.yaml'
  InfraTemplatePath:
    Description: Immutable infra packaged template path pattern
    Value: !Sub 's3://${ArtifactBucket}/${ServiceName}/<commit-sha>/infra/packaged.yaml'
  AppTemplatePath:
    Description: Immutable app packaged template path pattern
    Value: !Sub 's3://${ArtifactBucket}/${ServiceName}/<commit-sha>/app/packaged.yaml'
  FrameworkBundlePath:
    Description: Framework bundle object used by inline BuildSpecs when FrameworkPath is absent
    Value: !Sub 's3://${ArtifactBucket}/${FrameworkPrefix}/pipeline.tgz'
  CloudFormationDeployRoleArn:
    Description: CloudFormation service role for normal deploy
    Value: !GetAtt CloudFormationDeployRole.Arn
  CloudFormationRecoverDataRoleArn:
    Description: CloudFormation service role for data recovery IMPORT
    Value: !GetAtt CloudFormationRecoverDataRole.Arn
  RecoverDataRoleArn:
    Description: CodeBuild role used for recovery execute
    Value: !GetAtt RecoverDataRole.Arn
  PipelineRoleArn:
    Description: CodePipeline service role
    Value: !GetAtt PipelineRole.Arn
  BuildProjectNameOut:
    Description: Build CodeBuild project name (created or external)
    Value: !If
      - CreateBuildProject
      - !Ref BuildProject
      - !Ref BuildProjectName
  DeployDataProjectName:
    Description: Deploy-Data CodeBuild project
    Value: !Ref DeployDataProject
  RecoverDataProjectName:
    Description: Recover-Data CodeBuild project
    Value: !Ref RecoverDataProject
  DeployInfraProjectName:
    Description: Deploy-Infra CodeBuild project
    Value: !Ref DeployInfraProject
  DeployAppProjectName:
    Description: Deploy-App CodeBuild project
    Value: !Ref DeployAppProject
  ValidateSsmProjectName:
    Description: Validate-SSM CodeBuild project
    Value: !Ref ValidateSsmProject
  SmokeTestProjectName:
    Description: Smoke-Test CodeBuild project
    Value: !Ref SmokeTestProject
  RecordDeploymentProjectName:
    Description: Record-Deployment CodeBuild project
    Value: !Ref RecordDeploymentProject
