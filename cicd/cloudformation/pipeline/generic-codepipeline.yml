  BuildProject:
    Type: AWS::CodeBuild::Project
    Condition: CreateBuildProject
    Properties:
      Name: !Sub '${Stage}-${ServiceName}-build'
      Description: Package service artifacts, detect deployment changes, publish immutable commit-scoped packages, export DEPLOY_* flags.
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 60
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          env:
            shell: bash
            exported-variables:
              - DEPLOY_DATA
              - DEPLOY_INFRA
              - DEPLOY_APP
              - CURRENT_COMMIT
          phases:
            install:
              commands:
                - |
                  set -euo pipefail
                  if [ -d "${FrameworkPath}" ]; then
                    export CICD_FRAMEWORK_DIR="${!CODEBUILD_SRC_DIR}/${FrameworkPath}"
                    echo "Using monorepo framework at ${!CICD_FRAMEWORK_DIR}"
                  else
                    mkdir -p /tmp/cicd-framework
                    aws s3 cp "s3://${ArtifactBucket}/${FrameworkPrefix}/pipeline.tgz" /tmp/pipeline.tgz
                    tar -xzf /tmp/pipeline.tgz -C /tmp/cicd-framework
                    export CICD_FRAMEWORK_DIR=/tmp/cicd-framework
                    echo "Downloaded framework to ${!CICD_FRAMEWORK_DIR}"
                  fi
                  test -d "${!CICD_FRAMEWORK_DIR}/scripts"
                  chmod +x "${!CICD_FRAMEWORK_DIR}/scripts/"*.sh || true
            build:
              commands:
                - bash "${!CICD_FRAMEWORK_DIR}/scripts/run-build.sh"
            post_build:
              commands:
                - |
                  set -euo pipefail
                  if [ "${!CODEBUILD_BUILD_SUCCEEDING}" != "1" ]; then
                    echo "Build phase failed; not promoting CodePipeline variables."
                  else
                    source "${!CICD_FRAMEWORK_DIR}/scripts/promote-exported-variables.sh" \
                      "${!CODEBUILD_SRC_DIR}/deployment-decision.env" \
                      DEPLOY_DATA DEPLOY_INFRA DEPLOY_APP CURRENT_COMMIT
                  fi
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: !Ref CodeBuildImage
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: STAGE
            Type: PLAINTEXT
            Value: !Ref Stage
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName
          - Name: AWS_REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: ARTIFACT_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactBucket
          - Name: CI_PATH
            Type: PLAINTEXT
            Value: !Ref CiPath
          - Name: FRAMEWORK_PATH
            Type: PLAINTEXT
            Value: !Ref FrameworkPath
          - Name: FRAMEWORK_PREFIX
            Type: PLAINTEXT
            Value: !Ref FrameworkPrefix
          - Name: SSM_PREFIX
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}'
          - Name: LAST_DEPLOYED_COMMIT_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT'
          - Name: REQUIRED_SSM_PARAMETERS
            Type: PLAINTEXT
            Value: !Ref RequiredSsmParameters
          - Name: DATA_LOGICAL_ID
            Type: PLAINTEXT
            Value: !Ref DataLogicalId
          - Name: DATA_TABLE_NAME
            Type: PLAINTEXT
            Value: !Ref DataTableName
          - Name: OWNERSHIP_TAG_SERVICE
            Type: PLAINTEXT
            Value: !If
              - HasOwnershipTagService
              - !Ref OwnershipTagService
              - !Ref ServiceName
          - Name: OWNERSHIP_TAG_PURPOSE
            Type: PLAINTEXT
            Value: !Ref OwnershipTagPurpose
          - Name: ENABLE_DATA
            Type: PLAINTEXT
            Value: !Ref EnableData
          - Name: ENABLE_INFRA
            Type: PLAINTEXT
            Value: !Ref EnableInfra
          - Name: ENABLE_APP
            Type: PLAINTEXT
            Value: !Ref EnableApp
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage

  DeployDataProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${Stage}-${ServiceName}-deploy-data'
      Description: Preflight then create, update, or prepare IMPORT recovery of the Data Stack. STOP fails this stage. RECOVERY_REQUIRED prepares a change set and succeeds so approval can run. Does not execute IMPORT or modify DynamoDB table data.
      ServiceRole: !GetAtt DeployDataRole.Arn
      TimeoutInMinutes: 30
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          env:
            shell: bash
            exported-variables:
              - DATA_ACTION
              - DATA_REASON
              - RECOVERY_REQUIRED
              - RECOVERY_CHANGE_SET_NAME
              - RECOVERY_STACK_NAME
              - RECOVERY_TABLE_NAME
              - RECOVERY_STAGE
              - CURRENT_COMMIT
          phases:
            install:
              commands:
                - |
                  set -euo pipefail
                  if [ -d "${FrameworkPath}" ]; then
                    export CICD_FRAMEWORK_DIR="${!CODEBUILD_SRC_DIR}/${FrameworkPath}"
                    echo "Using monorepo framework at ${!CICD_FRAMEWORK_DIR}"
                  else
                    mkdir -p /tmp/cicd-framework
                    aws s3 cp "s3://${ArtifactBucket}/${FrameworkPrefix}/pipeline.tgz" /tmp/pipeline.tgz
                    tar -xzf /tmp/pipeline.tgz -C /tmp/cicd-framework
                    export CICD_FRAMEWORK_DIR=/tmp/cicd-framework
                    echo "Downloaded framework to ${!CICD_FRAMEWORK_DIR}"
                  fi
                  test -d "${!CICD_FRAMEWORK_DIR}/scripts"
                  chmod +x "${!CICD_FRAMEWORK_DIR}/scripts/"*.sh || true
            build:
              commands:
                - bash "${!CICD_FRAMEWORK_DIR}/scripts/run-deploy-data.sh"
            post_build:
              commands:
                - |
                  set -euo pipefail
                  if [ "${!CODEBUILD_BUILD_SUCCEEDING}" != "1" ]; then
                    echo "Build phase failed; not promoting CodePipeline variables."
                  else
                    source "${!CICD_FRAMEWORK_DIR}/scripts/promote-exported-variables.sh" \
                      "${!CODEBUILD_SRC_DIR}/data-deployment-variables.env" \
                      DATA_ACTION RECOVERY_REQUIRED CURRENT_COMMIT \
                      RECOVERY_STACK_NAME RECOVERY_TABLE_NAME RECOVERY_STAGE
                  fi
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref CodeBuildImage
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: STAGE
            Type: PLAINTEXT
            Value: !Ref Stage
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName
          - Name: AWS_REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: ARTIFACT_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactBucket
          - Name: CI_PATH
            Type: PLAINTEXT
            Value: !Ref CiPath
          - Name: FRAMEWORK_PATH
            Type: PLAINTEXT
            Value: !Ref FrameworkPath
          - Name: FRAMEWORK_PREFIX
            Type: PLAINTEXT
            Value: !Ref FrameworkPrefix
          - Name: SSM_PREFIX
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}'
          - Name: LAST_DEPLOYED_COMMIT_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT'
          - Name: REQUIRED_SSM_PARAMETERS
            Type: PLAINTEXT
            Value: !Ref RequiredSsmParameters
          - Name: DATA_LOGICAL_ID
            Type: PLAINTEXT
            Value: !Ref DataLogicalId
          - Name: DATA_TABLE_NAME
            Type: PLAINTEXT
            Value: !Ref DataTableName
          - Name: OWNERSHIP_TAG_SERVICE
            Type: PLAINTEXT
            Value: !If
              - HasOwnershipTagService
              - !Ref OwnershipTagService
              - !Ref ServiceName
          - Name: OWNERSHIP_TAG_PURPOSE
            Type: PLAINTEXT
            Value: !Ref OwnershipTagPurpose
