  RecoverDataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Stage}-${ServiceName}-recover-data-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringLike:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Stage}-${ServiceName}-deploy-data-role'
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage
        - Key: Stack
          Value: cicd
        - Key: Purpose
          Value: DataRecovery
      Policies:
        - PolicyName: recover-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Sid: DescribeDataStackAndChangeSet
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeChangeSet
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'
              - Sid: DescribeStacksAndChangeSetUnscoped
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackResource
                Resource: '*'
              - Sid: ImportDynamoDbTableOnly
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'
                Condition:
                  StringEquals:
                    cloudformation:ChangeSetType: IMPORT
                  ForAllValues:StringEqualsIgnoreCase:
                    cloudformation:ImportResourceTypes:
                      - AWS::DynamoDB::Table
                  'Null':
                    cloudformation:ImportResourceTypes: 'false'
              - Sid: UpdateDataStackAfterImport
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'
                Condition:
                  StringEquals:
                    cloudformation:ChangeSetType: UPDATE
              - Sid: ExecuteAndDiscardDataRecoveryChangeSet
                Effect: Allow
                Action:
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Stage}-${ServiceName}-data'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'
              - Sid: DenyUnrelatedCloudFormationImport
                Effect: Deny
                Action: cloudformation:CreateChangeSet
                Resource: '*'
                Condition:
                  ForAnyValue:StringNotEqualsIgnoreCase:
                    cloudformation:ImportResourceTypes:
                      - AWS::DynamoDB::Table
              - Sid: PassCfnRecoverDataRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRecoverDataRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: DescribeTableForRecovery
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:DescribeKinesisStreamingDestination
                  - dynamodb:ListTagsOfResource
                Resource:
                  - !If
                    - HasDataTableName
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTableName}'
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}'
                  - !If
                    - HasDataTableName
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTableName}/index/*'
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}/index/*'
                  - !If
                    - HasDataTableName
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTableName}/stream/*'
                    - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}/stream/*'
              - Sid: ReadDataSsmAfterImport
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/${ServiceName}/TABLE_NAME'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/${ServiceName}/TABLE_ARN'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Stage}/${ServiceName}/STREAM_ARN'
              - Sid: ReadDataPackagedTemplate
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ServiceName}/*/data/packaged.yaml'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${FrameworkPrefix}/*'
              - Sid: ReadPipelineInputArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
              - Sid: ListPipelineArtifactBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}'
              - Sid: DenyDeleteTable
                Effect: Deny
                Action: dynamodb:DeleteTable
                Resource: '*'
              - Sid: DenyS3ObjectDelete
                Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: '*'
              - Sid: DenyUnrestrictedIamChanges
                Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:CreateUser
                  - iam:DeleteUser
                  - iam:CreateAccessKey
                  - iam:PutUserPolicy
                  - iam:AttachUserPolicy
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                Resource: '*'

