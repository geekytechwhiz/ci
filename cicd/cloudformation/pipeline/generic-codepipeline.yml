            Type: PLAINTEXT
            Value: !Ref ApiBaseUrlParameter
          - Name: HEALTH_CHECK_PATH
            Type: PLAINTEXT
            Value: !Ref HealthCheckPath
          - Name: CFN_DEPLOY_ROLE_ARN
