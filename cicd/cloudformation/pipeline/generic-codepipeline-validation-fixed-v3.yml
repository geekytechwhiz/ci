  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${Stage}-${ServiceName}-build'
      Description: Primary package/build project. CloudFormation creates it automatically as ${Stage}-${ServiceName}-build.
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 60
      # CODEPIPELINE is required so the Build action can write OutputArtifacts.BuildArtifact
      # into ArtifactStore (ArtifactBucketName). Do not switch this to NO_ARTIFACTS or S3:
      # Deploy-Data, Recover-Data, Deploy-Infra, and Deploy-App
      # InputArtifacts: BuildArtifact and DOWNLOAD_SOURCE that object.
      # Validate-SSM and Record-Deployment use SourceArtifact (always present from Source).
      # Immutable deployment packages still go to s3://<ArtifactBucket>/<ServiceName>/<commit>/.
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2

          env:
            shell: bash
            exported-variables:
              - DEPLOY_DATA
              - DEPLOY_INFRA
              - DEPLOY_APP
              - CURRENT_COMMIT

          phases:
            build:
              commands:
                - |
                  set -euo pipefail
                  echo "========== SOURCE DEBUG =========="
                  echo "CODEBUILD_SOURCE_VERSION=${!CODEBUILD_SOURCE_VERSION:-<EMPTY>}"
                  echo "CODEBUILD_RESOLVED_SOURCE_VERSION=${!CODEBUILD_RESOLVED_SOURCE_VERSION:-<EMPTY>}"
                  echo "CODEBUILD_SOURCE_REPO_URL=${!CODEBUILD_SOURCE_REPO_URL:-<EMPTY>}"
                  echo "CODEBUILD_INITIATOR=${!CODEBUILD_INITIATOR:-<EMPTY>}"
                  echo "CODEBUILD_BUILD_ID=${!CODEBUILD_BUILD_ID:-<EMPTY>}"
                  echo "=================================="
                  export CURRENT_COMMIT="${!CODEBUILD_RESOLVED_SOURCE_VERSION:-}"

                  test -n "${!CURRENT_COMMIT}" || {
                    echo 'ERROR: source commit is empty' >&2
                    exit 1
                  }

                  echo "[BUILD] service=${!SERVICE_NAME} stage=${!STAGE} commit=${!CURRENT_COMMIT}"

                  NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

                  aws ssm put-parameter \
                    --name "${!CURRENT_EXECUTION_COMMIT_PARAM}" \
                    --type String \
                    --value "${!CURRENT_COMMIT}" \
                    --overwrite

                  aws ssm put-parameter \
                    --name "${!CURRENT_EXECUTION_STAGE_PARAM}" \
                    --type String \
                    --value "Build" \
                    --overwrite

                  aws ssm put-parameter \
                    --name "${!CURRENT_EXECUTION_STATUS_PARAM}" \
                    --type String \
                    --value "IN_PROGRESS" \
                    --overwrite

                  aws ssm put-parameter \
                    --name "${!CURRENT_EXECUTION_TIME_PARAM}" \
                    --type String \
                    --value "$NOW" \
                    --overwrite

                  # Service-owned packaging hook.
                  # The generic pipeline has no CI/CD framework dependency.
                  if [ -f "$CI_PATH/build.sh" ]; then
                    chmod +x "$CI_PATH/build.sh"
                    "$CI_PATH/build.sh"
                  fi

                  # Standard immutable artifact contract.
                  for f in data infra app; do
                    case "$f" in
                      data)
                        enabled="${!ENABLE_DATA}"
                        ;;
                      infra)
                        enabled="${!ENABLE_INFRA}"
                        ;;
                      app)
                        enabled="${!ENABLE_APP}"
                        ;;
                    esac

                    if [ "${!enabled}" = "true" ]; then
                      test -f "${!CODEBUILD_SRC_DIR}/${!f}/packaged.yaml" || {
                        echo "ERROR: missing ${!f}/packaged.yaml" >&2
                        exit 1
                      }
                    fi
                  done

                  PREFIX="${!SERVICE_NAME}/${!CURRENT_COMMIT}"

                  for f in data infra app; do
                    if [ -f "${!CODEBUILD_SRC_DIR}/${!f}/packaged.yaml" ]; then
                      aws s3 cp \
                        "${!CODEBUILD_SRC_DIR}/${!f}/packaged.yaml" \
                        "s3://${!ARTIFACT_BUCKET}/${!PREFIX}/${!f}/packaged.yaml" \
                        --metadata "commit=${!CURRENT_COMMIT},service=${!SERVICE_NAME}"
                    fi
                  done

                  # Optional service-owned import manifest for pre-existing resources.
                  if [ -f "${!CODEBUILD_SRC_DIR}/data/import-manifest.json" ]; then
                    aws s3 cp \
                      "${!CODEBUILD_SRC_DIR}/data/import-manifest.json" \
                      "s3://${!ARTIFACT_BUCKET}/${!PREFIX}/data/import-manifest.json" \
                      --metadata "commit=${!CURRENT_COMMIT},service=${!SERVICE_NAME}"
                  fi

                  export DEPLOY_DATA="$ENABLE_DATA"
                  export DEPLOY_INFRA="$ENABLE_INFRA"
                  export DEPLOY_APP="$ENABLE_APP"

                  printf \
                    'DEPLOY_DATA=%s\nDEPLOY_INFRA=%s\nDEPLOY_APP=%s\nCURRENT_COMMIT=%s\n' \
                    "$DEPLOY_DATA" \
                    "$DEPLOY_INFRA" \
                    "$DEPLOY_APP" \
                    "$CURRENT_COMMIT" \
                    > deployment-decision.env

                  cat > artifact-manifest.json <<EOF
                  {
                    "service": "${!SERVICE_NAME}",
                    "stage": "${!STAGE}",
                    "commit": "${!CURRENT_COMMIT}",
                    "artifactBucket": "${!ARTIFACT_BUCKET}",
                    "artifactPrefix": "${!PREFIX}/",
                    "data": "${!PREFIX}/data/packaged.yaml",
                    "infra": "${!PREFIX}/infra/packaged.yaml",
                    "app": "${!PREFIX}/app/packaged.yaml",
                    "dataImportManifest": "${!PREFIX}/data/import-manifest.json"
                  }
                  EOF

                  printf \
                    'CURRENT_COMMIT=%s\nARTIFACT_PREFIX=s3://%s/%s/\n' \
                    "$CURRENT_COMMIT" \
                    "$ARTIFACT_BUCKET" \
                    "$PREFIX" \
                    > codepipeline-artifact.txt

            post_build:
              commands:
                - |
                  if [ "${!CODEBUILD_BUILD_SUCCEEDING}" != "1" ]; then
                    echo "BUILD phase failed"
                    exit 1
                  fi

                  echo "[POST_BUILD] Build completed successfully"

                  test -f deployment-decision.env || {
                    echo "ERROR: deployment-decision.env was not generated" >&2
                    exit 1
                  }

                  test -f artifact-manifest.json || {
                    echo "ERROR: artifact-manifest.json was not generated" >&2
                    exit 1
                  }

                  test -f codepipeline-artifact.txt || {
                    echo "ERROR: codepipeline-artifact.txt was not generated" >&2
                    exit 1
                  }

                  echo "[POST_BUILD] Deployment decision:"
                  cat deployment-decision.env

                  echo "[POST_BUILD] Artifact manifest:"
                  cat artifact-manifest.json

                  echo "[POST_BUILD] CodePipeline artifact:"
                  cat codepipeline-artifact.txt

                  echo "[POST_BUILD] Build artifacts validated successfully"

          artifacts:
            files:
              - codepipeline-artifact.txt
              - deployment-decision.env
              - artifact-manifest.json
            discard-paths: no

      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: !Ref CodeBuildImage
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: STAGE
            Type: PLAINTEXT
            Value: !Ref Stage
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName
          - Name: AWS_REGION
