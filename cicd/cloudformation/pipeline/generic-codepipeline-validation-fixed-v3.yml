    Properties:
      Name: !Sub '${Stage}-${ServiceName}-validate-ssm'
      Description: Validate Data and Infrastructure SSM contracts after both stacks deploy. Does not deploy.
      ServiceRole: !GetAtt ValidateSsmRole.Arn
      TimeoutInMinutes: 10
      # CODEPIPELINE is required for pipeline InputArtifacts. This project has no
      # OutputArtifacts; CodePipeline overrides the upload to NO_ARTIFACTS.
      # PrimarySource is SourceArtifact (same as Record-Deployment), not BuildArtifact:
      # Validate-SSM always runs and only reads SSM. Depending on BuildArtifact
      # fails DOWNLOAD_SOURCE with NoSuchKey when that object was never written
      # or when a later stage is retried on an execution whose Build zip is missing.
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            build:
              commands:
                - |
                  set -euo pipefail
                  if [ -z "${!REQUIRED_SSM_PARAMETERS:-}" ]; then
                    echo "[SSM] No required parameters configured; validation passed."
                    exit 0
                  fi
                  IFS=',' read -ra NAMES <<< "${!REQUIRED_SSM_PARAMETERS}"
                  for leaf in "${!NAMES[@]}"; do
                    leaf="$(echo "$leaf" | xargs)"
                    [ -z "$leaf" ] && continue
                    name="${!SSM_PREFIX}/$leaf"
                    aws ssm get-parameter --name "$name" >/dev/null
                    echo "[SSM] present: $name"
                  done

      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref CodeBuildImage
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: STAGE
            Type: PLAINTEXT
            Value: !Ref Stage
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName
          - Name: AWS_REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: ARTIFACT_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactBucket
          - Name: CI_PATH
            Type: PLAINTEXT
            Value: !Ref CiPath
          - Name: SSM_PREFIX
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}'
          - Name: LAST_DEPLOYED_COMMIT_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT'
          - Name: REQUIRED_SSM_PARAMETERS
            Type: PLAINTEXT
            Value: !Ref RequiredSsmParameters
          - Name: OWNERSHIP_TAG_SERVICE
            Type: PLAINTEXT
            Value: !If
              - HasOwnershipTagService
              - !Ref OwnershipTagService
              - !Ref ServiceName
          - Name: OWNERSHIP_TAG_PURPOSE
            Type: PLAINTEXT
            Value: !Ref OwnershipTagPurpose
          - Name: ENABLE_DATA
            Type: PLAINTEXT
            Value: !Ref EnableData
          - Name: ENABLE_INFRA
            Type: PLAINTEXT
            Value: !Ref EnableInfra
          - Name: ENABLE_APP
            Type: PLAINTEXT
            Value: !Ref EnableApp
          - Name: STACK_NAME
            Type: PLAINTEXT
            Value: !Sub '${Stage}-${ServiceName}'
          - Name: INFRA_STACK_NAME
            Type: PLAINTEXT
            Value: !Sub '${Stage}-${ServiceName}-infra'
          - Name: DATA_STACK_NAME
            Type: PLAINTEXT
            Value: !Sub '${Stage}-${ServiceName}-data'
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage

  RecordDeploymentProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${Stage}-${ServiceName}-record-deployment'
      Description: Record the current source commit as LAST_DEPLOYED_COMMIT after a successful pipeline. Does not deploy.
      ServiceRole: !GetAtt RecordDeploymentRole.Arn
      TimeoutInMinutes: 10
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            build:
              commands:
                - |
                  set -euo pipefail

                  on_failure() {
                    rc=$?
                    aws ssm put-parameter --name "${!CURRENT_EXECUTION_STATUS_PARAM}" --type String --value "FAILED" --overwrite || true
                    aws ssm put-parameter --name "${!CURRENT_EXECUTION_STAGE_PARAM}" --type String --value "Record-Deployment" --overwrite || true
                    exit "$rc"
                  }
                  trap on_failure EXIT

                  : "${!CURRENT_COMMIT:?CURRENT_COMMIT must be supplied by BuildVariables}"
                  PREFIX="${!SERVICE_NAME}/${!CURRENT_COMMIT}"
                  for f in data infra app; do
                    case "$f" in
                      data) enabled="${!ENABLE_DATA}" ;;
                      infra) enabled="${!ENABLE_INFRA}" ;;
                      app) enabled="${!ENABLE_APP}" ;;
                    esac
                    if [ "${!enabled}" = "true" ]; then
                      key="${!PREFIX}/$f/packaged.yaml"
                      aws s3api head-object --bucket "${!ARTIFACT_BUCKET}" --key "$key" >/dev/null
                      echo "[RECORD] verified artifact: s3://${!ARTIFACT_BUCKET}/$key"
                    fi
                  done
                  NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  ARTIFACT_URI="s3://${!ARTIFACT_BUCKET}/${!PREFIX}/"

                  # CURRENT_EXECUTION_* describes this pipeline execution.
                  # LAST_* is only advanced after the complete deployment path succeeds.
                  aws ssm put-parameter --name "${!CURRENT_EXECUTION_COMMIT_PARAM}" --type String --value "${!CURRENT_COMMIT}" --overwrite
                  aws ssm put-parameter --name "${!CURRENT_EXECUTION_STAGE_PARAM}" --type String --value "Record-Deployment" --overwrite
                  aws ssm put-parameter --name "${!CURRENT_EXECUTION_STATUS_PARAM}" --type String --value "SUCCESS" --overwrite
                  aws ssm put-parameter --name "${!CURRENT_EXECUTION_TIME_PARAM}" --type String --value "$NOW" --overwrite

                  # ------------------------------------------------------------
                  # Deployment verification gate
                  # ------------------------------------------------------------
                  # LAST_* is advanced only after every enabled target stack is verified.
                  EVIDENCE_FILE="$(mktemp)"
                  VERIFICATION_FILE="$(mktemp)"
                  printf '%s\n' '{}' > "${!EVIDENCE_FILE}"

                  verify_stack() {
                    stack_var="$1"
                    artifact_uri="$2"
                    enabled_var="$3"

                    if [ "$enabled_var" != "true" ]; then
                      return 0
                    fi

                    case "$stack_var" in
                      DATA_STACK_NAME) stack_name="$DATA_STACK_NAME" ;;
                      INFRA_STACK_NAME) stack_name="$INFRA_STACK_NAME" ;;
                      APP_STACK_NAME) stack_name="$APP_STACK_NAME" ;;
                      *) echo "[VERIFY] unknown stack variable: $stack_var" >&2; return 1 ;;
                    esac

                    echo "[VERIFY] stack=$stack_name expected_artifact=$artifact_uri"

                    stack_status="$(aws cloudformation describe-stacks                       --stack-name "${!stack_name}"                       --query 'Stacks[0].StackStatus'                       --output text)"

                    case "${!stack_status}" in
                      CREATE_COMPLETE|UPDATE_COMPLETE|IMPORT_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
                        ;;
                      *)
                        echo "[VERIFY] stack=${!stack_name} invalid status=${!stack_status}" >&2
                        return 1
                        ;;
                    esac

                    python3 - "${!EVIDENCE_FILE}" "${!stack_name}" "${!stack_status}" "${!artifact_uri}" "${!CURRENT_COMMIT}" <<'PY'
                      import json, sys
                      path, stack, status, artifact, commit = sys.argv[1:]
                      with open(path) as f:
                        evidence = json.load(f)
                      evidence[stack] = {
                        "stackStatus": status,
                        "expectedArtifact": artifact,
                        "commit": commit,
                        "verified": True
                      }
                      with open(path, "w") as f:
                        json.dump(evidence, f, separators=(",", ":"))
                    PY
                  }

                  verify_stack "DATA_STACK_NAME" "s3://${!ARTIFACT_BUCKET}/${!PREFIX}data/packaged.yaml" "${!ENABLE_DATA}"
                  verify_stack "INFRA_STACK_NAME" "s3://${!ARTIFACT_BUCKET}/${!PREFIX}infra/packaged.yaml" "${!ENABLE_INFRA}"
                  verify_stack "APP_STACK_NAME" "s3://${!ARTIFACT_BUCKET}/${!PREFIX}app/packaged.yaml" "${!ENABLE_APP}"

                  VERIFICATION_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  python3 - "${!EVIDENCE_FILE}" "${!VERIFICATION_FILE}" "${!CURRENT_COMMIT}" "${!VERIFICATION_TIME}" <<'PY'
                    import json, sys
                    evidence_path, verification_path, commit, verified_at = sys.argv[1:]
                    with open(evidence_path) as f:
                      stacks = json.load(f)
                    result = {
                      "verified": True,
                      "commit": commit,
                      "verifiedAt": verified_at,
                      "stacks": stacks
                    }
                    with open(verification_path, "w") as f:
                      json.dump(result, f, separators=(",", ":"))
                  PY

                  aws ssm put-parameter                     --name "${!DEPLOYMENT_EVIDENCE_PARAM}"                     --type String                     --value "$(cat "${!EVIDENCE_FILE}")"                     --overwrite

                  aws ssm put-parameter                     --name "${!DEPLOYMENT_VERIFICATION_PARAM}"                     --type String                     --value "$(cat "${!VERIFICATION_FILE}")"                     --overwrite

                  aws ssm put-parameter --name "${!LAST_DEPLOYED_COMMIT_PARAM}" --type String --value "${!CURRENT_COMMIT}" --overwrite
                  aws ssm put-parameter --name "${!LAST_DEPLOYED_ARTIFACT_PARAM}" --type String --value "${!ARTIFACT_URI}" --overwrite
                  aws ssm put-parameter --name "${!LAST_DEPLOYMENT_STATUS_PARAM}" --type String --value SUCCESS --overwrite
                  aws ssm put-parameter --name "${!LAST_DEPLOYMENT_TIME_PARAM}" --type String  --overwrite
                  printf 'DEPLOYMENT_STATUS=SUCCESS\nDEPLOYED_COMMIT=%s\nDEPLOYED_ARTIFACT=%s\n' "${!CURRENT_COMMIT}" "${!ARTIFACT_URI}" > deployment-status.env
            post_build:
              commands: []
          artifacts:
            files:
              - deployment-status.env

      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref CodeBuildImage
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: STAGE
            Type: PLAINTEXT
            Value: !Ref Stage
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName
          - Name: AWS_REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: ARTIFACT_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactBucket
          - Name: CI_PATH
            Type: PLAINTEXT
            Value: !Ref CiPath
          - Name: SSM_PREFIX
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}'
          - Name: LAST_DEPLOYED_COMMIT_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT'
          - Name: LAST_DEPLOYED_ARTIFACT_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_ARTIFACT'
          - Name: LAST_DEPLOYMENT_STATUS_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYMENT_STATUS'
          - Name: LAST_DEPLOYMENT_TIME_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYMENT_TIME'
          - Name: CURRENT_EXECUTION_COMMIT_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/CURRENT_EXECUTION_COMMIT'
          - Name: CURRENT_EXECUTION_STATUS_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/CURRENT_EXECUTION_STATUS'
          - Name: CURRENT_EXECUTION_STAGE_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/CURRENT_EXECUTION_STAGE'
          - Name: CURRENT_EXECUTION_TIME_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/CURRENT_EXECUTION_TIME'
          - Name: DEPLOYMENT_EVIDENCE_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/DEPLOYMENT_EVIDENCE'
          - Name: DEPLOYMENT_VERIFICATION_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/DEPLOYMENT_VERIFICATION'
          - Name: DATA_STACK_NAME
            Type: PLAINTEXT
            Value: !Sub '${Stage}-${ServiceName}-data'
          - Name: INFRA_STACK_NAME
            Type: PLAINTEXT
            Value: !Sub '${Stage}-${ServiceName}-infra'
          - Name: APP_STACK_NAME
            Type: PLAINTEXT
            Value: !Sub '${Stage}-${ServiceName}'
          - Name: REQUIRED_SSM_PARAMETERS
            Type: PLAINTEXT
            Value: !Ref RequiredSsmParameters
          - Name: OWNERSHIP_TAG_SERVICE
            Type: PLAINTEXT
            Value: !If
              - HasOwnershipTagService
              - !Ref OwnershipTagService
              - !Ref ServiceName
          - Name: OWNERSHIP_TAG_PURPOSE
            Type: PLAINTEXT
            Value: !Ref OwnershipTagPurpose
          - Name: ENABLE_DATA
            Type: PLAINTEXT
            Value: !Ref EnableData
          - Name: ENABLE_INFRA
            Type: PLAINTEXT
            Value: !Ref EnableInfra
          - Name: ENABLE_APP
            Type: PLAINTEXT
            Value: !Ref EnableApp
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage


  ServicePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref PipelineName
      PipelineType: V2
      ExecutionMode: QUEUED
      RestartExecutionOnUpdate: false
      RoleArn: !GetAtt PipelineRole.Arn
      Variables:
        - Name: ArtifactBucket
          DefaultValue: !Ref ArtifactBucket
          Description: Centralized environment artifact bucket. CodeBuild receives ARTIFACT_BUCKET=#{variables.ArtifactBucket}.
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              RunOrder: 1
              OutputArtifacts:
                - Name: SourceArtifact
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubFullRepositoryId
                BranchName: !Ref GitHubBranch
                DetectChanges: 'true'
                OutputArtifactFormat: CODE_ZIP

        - Name: Build
          Actions:
            - Name: Build
              Namespace: BuildVariables
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref BuildProject
                # BuildArtifact is the CodePipeline artifact-store object produced by
                # the Build project's buildspec artifacts section. It is not the
                # immutable deployment prefix in ArtifactBucket.
                PrimarySource: SourceArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"SERVICE_NAME","value":"${ServiceName}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"ENABLE_DATA","value":"${EnableData}","type":"PLAINTEXT"},{"name":"ENABLE_INFRA","value":"${EnableInfra}","type":"PLAINTEXT"},{"name":"ENABLE_APP","value":"${EnableApp}","type":"PLAINTEXT"},{"name":"CI_PATH","value":"${CiPath}","type":"PLAINTEXT"},{"name":"LAST_DEPLOYED_COMMIT_PARAM","value":"/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT","type":"PLAINTEXT"}]'
              # Namespace BuildVariables exposes DEPLOY_DATA / DEPLOY_INFRA /
              # DEPLOY_APP / CURRENT_COMMIT from CodeBuild exported-variables.
              # Later stages consume #{BuildVariables.DEPLOY_*} via BeforeEntry
              # VariableCheck (Result SKIP) and #{BuildVariables.CURRENT_COMMIT}
              # for artifact fetch and Record-Deployment.
              # VariableCheck treats an empty resolved value as a configuration
              # error ("Variable cannot be empty"), so Build post_build must
              # source deployment-decision.env into the CodeBuild parent shell.

        - Name: Deploy-Data
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: DeployDataVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{BuildVariables.DEPLOY_DATA}'
          Actions:
            - Name: DeployData
              Namespace: DataDeploymentVariables
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
              OutputArtifacts:
                - Name: DataPreflightArtifact
              Configuration:
                ProjectName: !Ref DeployDataProject
                PrimarySource: BuildArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"}]'
              # Namespace DataDeploymentVariables exposes DATA_ACTION /
              # DATA_REASON / RECOVERY_REQUIRED / RECOVERY_CHANGE_SET_NAME /
              # RECOVERY_STACK_NAME / RECOVERY_TABLE_NAME / RECOVERY_STAGE /
              # CURRENT_COMMIT from CodeBuild exported-variables.
              # Approve-Data-Recovery and Recover-Data BeforeEntry VariableCheck
              # encodes #{DataDeploymentVariables.RECOVERY_REQUIRED} == 'true':
              # EQ true RUNS the stage; any other value fails the rule and SKIP
              # engages. CREATE/UPDATE export RECOVERY_REQUIRED=false.

        - Name: Approve-Data-Recovery
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: ApproveDataRecoveryVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{DataDeploymentVariables.RECOVERY_REQUIRED}'
          Actions:
            - Name: ApproveDataRecovery
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              RunOrder: 1
              Configuration:
                CustomData: !Sub 'Service: ${ServiceName}. Stage: ${Stage}. Commit: #{BuildVariables.CURRENT_COMMIT}. Action: #{DataDeploymentVariables.DATA_ACTION}. Existing data resource: #{DataDeploymentVariables.RECOVERY_TABLE_NAME}. Target stack: #{DataDeploymentVariables.RECOVERY_STACK_NAME}. Change set: #{DataDeploymentVariables.RECOVERY_CHANGE_SET_NAME}. Recovery: import existing DynamoDB table into CloudFormation. Safety: table will NOT be deleted or recreated. Approve only if this is the expected production table.'

        - Name: Recover-Data
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: RecoverDataVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{DataDeploymentVariables.RECOVERY_REQUIRED}'
          Actions:
            - Name: RecoverData
              Namespace: DataRecoveryVariables
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
                - Name: DataPreflightArtifact
              Configuration:
                ProjectName: !Ref RecoverDataProject
                PrimarySource: BuildArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"},{"name":"DATA_ACTION","value":"#{DataDeploymentVariables.DATA_ACTION}","type":"PLAINTEXT"},{"name":"RECOVERY_REQUIRED","value":"#{DataDeploymentVariables.RECOVERY_REQUIRED}","type":"PLAINTEXT"},{"name":"RECOVERY_CHANGE_SET_NAME","value":"#{DataDeploymentVariables.RECOVERY_CHANGE_SET_NAME}","type":"PLAINTEXT"},{"name":"RECOVERY_STACK_NAME","value":"#{DataDeploymentVariables.RECOVERY_STACK_NAME}","type":"PLAINTEXT"},{"name":"RECOVERY_TABLE_NAME","value":"#{DataDeploymentVariables.RECOVERY_TABLE_NAME}","type":"PLAINTEXT"},{"name":"CHANGE_SET_NAME","value":"#{DataDeploymentVariables.RECOVERY_CHANGE_SET_NAME}","type":"PLAINTEXT"},{"name":"DATA_RECOVERY_PHASE","value":"execute","type":"PLAINTEXT"},{"name":"RECOVERY_STATUS","value":"APPROVAL_GRANTED","type":"PLAINTEXT"}]'

        - Name: Deploy-Infra
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: DeployInfraVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{BuildVariables.DEPLOY_INFRA}'
          Actions:
            - Name: DeployInfra
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref DeployInfraProject
                PrimarySource: BuildArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"}]'

        - Name: Validate-SSM
          Actions:
            - Name: ValidateSSM
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: SourceArtifact
              Configuration:
                ProjectName: !Ref ValidateSsmProject
                PrimarySource: SourceArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"REQUIRED_SSM_PARAMETERS","value":"${RequiredSsmParameters}","type":"PLAINTEXT"},{"name":"SSM_PREFIX","value":"/${Stage}/${ServiceName}","type":"PLAINTEXT"}]'

        - Name: Deploy-App
          BeforeEntry:
            Conditions:
              - Result: SKIP
                Rules:
                  - Name: DeployAppVariableCheck
                    RuleTypeId:
                      Category: Rule
                      Owner: AWS
                      Provider: VariableCheck
                      Version: '1'
                    Configuration:
                      Operator: EQ
                      Value: 'true'
                      Variable: '#{BuildVariables.DEPLOY_APP}'
          Actions:
            - Name: DeployApp
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref DeployAppProject
                PrimarySource: BuildArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"STACK_NAME","value":"${Stage}-${ServiceName}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"}]'

        - Name: Record-Deployment
          Actions:
            - Name: RecordDeployment
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              RunOrder: 1
              InputArtifacts:
                - Name: SourceArtifact
              Configuration:
                ProjectName: !Ref RecordDeploymentProject
                PrimarySource: SourceArtifact
                EnvironmentVariables: !Sub '[{"name":"STAGE","value":"${Stage}","type":"PLAINTEXT"},{"name":"SERVICE_NAME","value":"${ServiceName}","type":"PLAINTEXT"},{"name":"AWS_REGION","value":"${AWS::Region}","type":"PLAINTEXT"},{"name":"CURRENT_COMMIT","value":"#{BuildVariables.CURRENT_COMMIT}","type":"PLAINTEXT"},{"name":"ARTIFACT_BUCKET","value":"#{variables.ArtifactBucket}","type":"PLAINTEXT"},{"name":"ENABLE_DATA","value":"${EnableData}","type":"PLAINTEXT"},{"name":"ENABLE_INFRA","value":"${EnableInfra}","type":"PLAINTEXT"},{"name":"ENABLE_APP","value":"${EnableApp}","type":"PLAINTEXT"},{"name":"LAST_DEPLOYED_COMMIT_PARAM","value":"/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT","type":"PLAINTEXT"},{"name":"LAST_DEPLOYED_ARTIFACT_PARAM","value":"/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_ARTIFACT","type":"PLAINTEXT"},{"name":"LAST_DEPLOYMENT_STATUS_PARAM","value":"/${Stage}/${ServiceName}/cicd/LAST_DEPLOYMENT_STATUS","type":"PLAINTEXT"},{"name":"LAST_DEPLOYMENT_TIME_PARAM","value":"/${Stage}/${ServiceName}/cicd/LAST_DEPLOYMENT_TIME","type":"PLAINTEXT"}]'

Outputs:
  PipelineName:
    Description: CodePipeline name
    Value: !Ref ServicePipeline
  PipelineArn:
    Description: CodePipeline ARN
    Value: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${PipelineName}'
  DataStackName:
    Description: Derived data stack name
    Value: !Sub '${Stage}-${ServiceName}-data'
  InfraStackName:
    Description: Derived infrastructure stack name
    Value: !Sub '${Stage}-${ServiceName}-infra'
  AppStackName:
    Description: Derived application stack name
    Value: !Sub '${Stage}-${ServiceName}'
  CicdStackName:
    Description: Expected CICD stack name for this template
    Value: !Sub '${Stage}-${ServiceName}-cicd'
  LastDeployedCommitParameter:
    Description: SSM parameter written by Record-Deployment
    Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT'
  SsmPrefix:
    Description: Service SSM parameter prefix
    Value: !Sub '/${Stage}/${ServiceName}'
  DataTemplatePath:
    Description: Immutable data packaged template path pattern
    Value: !Sub 's3://${ArtifactBucket}/${ServiceName}/<commit-sha>/data/packaged.yaml'
