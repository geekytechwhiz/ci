  DeployDataProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${Stage}-${ServiceName}-deploy-data'
      Description: Preflight then create, update, or prepare IMPORT recovery of the Data Stack. STOP fails this stage. RECOVERY_REQUIRED prepares a change set and succeeds so approval can run. Does not execute IMPORT or modify DynamoDB table data.
      ServiceRole: !GetAtt DeployDataRole.Arn
      TimeoutInMinutes: 30
      # CODEPIPELINE is required so DeployData can write OutputArtifacts.DataPreflightArtifact
      # for Recover-Data (InputArtifacts includes DataPreflightArtifact).
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          env:
            shell: bash
            exported-variables:
              - DATA_ACTION
              - DATA_REASON
              - RECOVERY_REQUIRED
              - RECOVERY_CHANGE_SET_NAME
              - RECOVERY_STACK_NAME
              - RECOVERY_TABLE_NAME
              - RECOVERY_STAGE
              - CURRENT_COMMIT
          phases:
            build:
              commands:
                - |
                  set -euo pipefail
                  : "${!CURRENT_COMMIT:?CURRENT_COMMIT must be supplied by BuildVariables}"
                  TEMPLATE_KEY="${!SERVICE_NAME}/${!CURRENT_COMMIT}/data/packaged.yaml"
                  TEMPLATE_URL="https://s3.${!AWS_REGION}.amazonaws.com/${!ARTIFACT_BUCKET}/${!TEMPLATE_KEY}"
                  aws s3api head-object --bucket "${!ARTIFACT_BUCKET}" --key "${!TEMPLATE_KEY}" >/dev/null
                  aws cloudformation validate-template --template-url "${!TEMPLATE_URL}" >/dev/null
                  export DATA_ACTION=CREATE
                  export DATA_REASON="new data stack"
                  export RECOVERY_REQUIRED=false
                  export RECOVERY_CHANGE_SET_NAME=""
                  export RECOVERY_STACK_NAME="${!DATA_STACK_NAME}"
                  export RECOVERY_TABLE_NAME=""
                  export RECOVERY_STAGE="${!STAGE}"

                  if aws cloudformation describe-stacks --stack-name "${!DATA_STACK_NAME}" >/dev/null 2>&1; then
                    export DATA_ACTION=UPDATE
                    export DATA_REASON="data stack exists"
                    CHANGE_SET_TYPE=UPDATE
                  else
                    # A service-owned import manifest is required when a pre-existing
                    # resource must be adopted without deletion/recreation.
                    IMPORT_KEY="${!SERVICE_NAME}/${!CURRENT_COMMIT}/data/import-manifest.json"
                    if aws s3api head-object --bucket "${!ARTIFACT_BUCKET}" --key "${!IMPORT_KEY}" >/dev/null 2>&1; then
                      export DATA_ACTION=IMPORT
                      export DATA_REASON="pre-existing resources require CloudFormation import"
                      export RECOVERY_REQUIRED=true
                      export RECOVERY_CHANGE_SET_NAME="import-${!CURRENT_COMMIT:0:12}-${!CODEBUILD_BUILD_NUMBER}"
                      export RECOVERY_TABLE_NAME="service-owned-import-manifest"
                      aws s3 cp "s3://${!ARTIFACT_BUCKET}/${!IMPORT_KEY}" /tmp/import-manifest.json
                      if ! aws cloudformation describe-stacks --stack-name "${!DATA_STACK_NAME}" >/dev/null 2>&1; then
                        cat > /tmp/empty-stack.yaml <<'EOF'
                        AWSTemplateFormatVersion: '2010-09-09'
                        Resources: {}
                        EOF
                        aws cloudformation create-stack --stack-name "${!DATA_STACK_NAME}" --template-body file:///tmp/empty-stack.yaml --role-arn "${!CFN_DEPLOY_ROLE_ARN}"
                        aws cloudformation wait stack-create-complete --stack-name "${!DATA_STACK_NAME}"
                      fi
                      # DeployDataRole explicitly denies CloudFormation IMPORT. Assume the
                      # narrowly-scoped RecoverDataRole for the IMPORT change-set preparation.
                      read AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN < <(aws sts assume-role \
                        --role-arn "${!RECOVER_DATA_ROLE_ARN}" \
                        --role-session-name "data-import-${!CODEBUILD_BUILD_NUMBER}" \
                        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
                        --output text)
                      export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
                      aws cloudformation create-change-set \
                        --stack-name "${!DATA_STACK_NAME}" \
                        --change-set-name "${!RECOVERY_CHANGE_SET_NAME}" \
                        --change-set-type IMPORT \
                        --template-url "${!TEMPLATE_URL}" \
                        --resources-to-import file:///tmp/import-manifest.json \
                        --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM AUTO_EXPAND \
                        --role-arn "${!CFN_RECOVER_ROLE_ARN}"
                      aws cloudformation wait change-set-create-complete --stack-name "${!DATA_STACK_NAME}" --change-set-name "${!RECOVERY_CHANGE_SET_NAME}"
                    else
                      CHANGE_SET_TYPE=CREATE
                    fi
                  fi

                  if [ "${!RECOVERY_REQUIRED}" != true ]; then
                    CHANGE_SET_NAME="pipeline-data-${!CURRENT_COMMIT:0:12}-${!CODEBUILD_BUILD_NUMBER}"
                    aws cloudformation create-change-set \
                      --stack-name "${!DATA_STACK_NAME}" \
                      --change-set-name "${!CHANGE_SET_NAME}" \
                      --change-set-type "${!CHANGE_SET_TYPE}" \
                      --template-url "${!TEMPLATE_URL}" \
                      --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM AUTO_EXPAND \
                      --role-arn "${!CFN_DEPLOY_ROLE_ARN}"
                    aws cloudformation wait change-set-create-complete --stack-name "${!DATA_STACK_NAME}" --change-set-name "${!CHANGE_SET_NAME}" || { aws cloudformation describe-change-set --stack-name "${!DATA_STACK_NAME}" --change-set-name "${!CHANGE_SET_NAME}" || true; exit 1; }
                    aws cloudformation execute-change-set --stack-name "${!DATA_STACK_NAME}" --change-set-name "${!CHANGE_SET_NAME}"
                    if [ "${!CHANGE_SET_TYPE}" = CREATE ]; then aws cloudformation wait stack-create-complete --stack-name "${!DATA_STACK_NAME}"; else aws cloudformation wait stack-update-complete --stack-name "${!DATA_STACK_NAME}"; fi
                    echo "[DEPLOYMENT-STATUS] DATA_DEPLOYED commit=${!CURRENT_COMMIT} stack=${!DATA_STACK_NAME} template=${!TEMPLATE_URL}"
                  else
                    echo "[DEPLOYMENT-STATUS] DATA_IMPORT_PENDING commit=${!CURRENT_COMMIT} stack=${!DATA_STACK_NAME} changeSet=${!RECOVERY_CHANGE_SET_NAME}"
                  fi
                  printf 'CURRENT_COMMIT=%s\nDATA_ACTION=%s\nRECOVERY_REQUIRED=%s\nRECOVERY_CHANGE_SET_NAME=%s\nRECOVERY_STACK_NAME=%s\nRECOVERY_TABLE_NAME=%s\nRECOVERY_STAGE=%s\n' \
                    "${!CURRENT_COMMIT}" "${!DATA_ACTION}" "${!RECOVERY_REQUIRED}" "${!RECOVERY_CHANGE_SET_NAME}" "${!RECOVERY_STACK_NAME}" "${!RECOVERY_TABLE_NAME}" "${!RECOVERY_STAGE}" > deployment-data-variables.env
            post_build:
              commands:
                - |
                  mkdir -p .pipeline-data-preflight
                  cp deployment-data-variables.env .pipeline-data-preflight/
                  printf 'CURRENT_COMMIT=%s\n' "${!CURRENT_COMMIT}" > .pipeline-data-preflight/data-preflight-artifact.txt
          artifacts:
            files:
              - .pipeline-data-preflight/**/*
            discard-paths: yes

      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref CodeBuildImage
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: STAGE
            Type: PLAINTEXT
            Value: !Ref Stage
          - Name: SERVICE_NAME
            Type: PLAINTEXT
            Value: !Ref ServiceName
          - Name: AWS_REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: ARTIFACT_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactBucket
          - Name: CI_PATH
            Type: PLAINTEXT
            Value: !Ref CiPath
          - Name: SSM_PREFIX
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}'
          - Name: LAST_DEPLOYED_COMMIT_PARAM
            Type: PLAINTEXT
            Value: !Sub '/${Stage}/${ServiceName}/cicd/LAST_DEPLOYED_COMMIT'
          - Name: REQUIRED_SSM_PARAMETERS
            Type: PLAINTEXT
            Value: !Ref RequiredSsmParameters
          - Name: OWNERSHIP_TAG_SERVICE
            Type: PLAINTEXT
            Value: !If
              - HasOwnershipTagService
              - !Ref OwnershipTagService
              - !Ref ServiceName
          - Name: OWNERSHIP_TAG_PURPOSE
            Type: PLAINTEXT
            Value: !Ref OwnershipTagPurpose
          - Name: ENABLE_DATA
            Type: PLAINTEXT
            Value: !Ref EnableData
          - Name: ENABLE_INFRA
            Type: PLAINTEXT
            Value: !Ref EnableInfra
          - Name: ENABLE_APP
            Type: PLAINTEXT
            Value: !Ref EnableApp
          - Name: DATA_STACK_NAME
            Type: PLAINTEXT
            Value: !Sub '${Stage}-${ServiceName}-data'
          - Name: CFN_DEPLOY_ROLE_ARN
            Type: PLAINTEXT
            Value: !GetAtt CloudFormationDeployRole.Arn
          - Name: CFN_RECOVER_ROLE_ARN
            Type: PLAINTEXT
            Value: !GetAtt CloudFormationRecoverDataRole.Arn
          - Name: RECOVER_DATA_ROLE_ARN
            Type: PLAINTEXT
            Value: !GetAtt RecoverDataRole.Arn
          - Name: DATA_PREFLIGHT_ENV
            Type: PLAINTEXT
            Value: deployment-data-preflight.env
          - Name: DATA_RECOVERY_ENV
            Type: PLAINTEXT
            Value: deployment-data-recovery.env
          - Name: DATA_RECOVERY_PHASE
            Type: PLAINTEXT
            Value: prepare
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Stage
          Value: !Ref Stage

  RecoverDataProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${Stage}-${ServiceName}-recover-data'
      Description: After manual approval, execute the prepared Data IMPORT change set and restore the Data SSM contract. Does not delete or recreate DynamoDB.
      ServiceRole: !GetAtt RecoverDataRole.Arn
      TimeoutInMinutes: 30
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          env:
            shell: bash
            exported-variables:
              - RECOVERY_SUCCESS
              - DATA_ACTION
              - CURRENT_COMMIT
          phases:
            build:
              commands:
                - |
                  set -euo pipefail
                  : "${!CURRENT_COMMIT:?CURRENT_COMMIT must be supplied by BuildVariables}"
                  : "${!RECOVERY_CHANGE_SET_NAME:?RECOVERY_CHANGE_SET_NAME must be supplied}"
                  TEMPLATE_KEY="${!SERVICE_NAME}/${!CURRENT_COMMIT}/data/packaged.yaml"
                  TEMPLATE_URL="https://s3.${!AWS_REGION}.amazonaws.com/${!ARTIFACT_BUCKET}/${!TEMPLATE_KEY}"
                  IMPORT_KEY="${!SERVICE_NAME}/${!CURRENT_COMMIT}/data/import-manifest.json"
                  aws s3 cp "s3://${!ARTIFACT_BUCKET}/${!IMPORT_KEY}" /tmp/import-manifest.json
                  aws s3api head-object --bucket "${!ARTIFACT_BUCKET}" --key "${!TEMPLATE_KEY}" >/dev/null
                  aws cloudformation execute-change-set --stack-name "${!DATA_STACK_NAME}" --change-set-name "${!RECOVERY_CHANGE_SET_NAME}"
                  aws cloudformation wait stack-import-complete --stack-name "${!DATA_STACK_NAME}"
                  export RECOVERY_SUCCESS=true
                  export DATA_ACTION=IMPORT
                  echo "[DEPLOYMENT-STATUS] DATA_IMPORTED commit=${!CURRENT_COMMIT} stack=${!DATA_STACK_NAME} template=${!TEMPLATE_URL}"
                  printf 'RECOVERY_SUCCESS=true\nDATA_ACTION=IMPORT\nCURRENT_COMMIT=%s\n' "${!CURRENT_COMMIT}" > deployment-data-recovery-result.env
            post_build:
              commands:
                - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"

      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref CodeBuildImage
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: STAGE
            Type: PLAINTEXT
