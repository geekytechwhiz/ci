version: 0.2
# Reference buildspec: Build stage
# Inline CFN buildspecs should mirror this: bootstrap → run-build.sh
# Exported variables feed CodePipeline stage conditions.

env:
  shell: bash
  exported-variables:
    - DEPLOY_DATA
    - DEPLOY_INFRA
    - DEPLOY_APP
    - CURRENT_COMMIT

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - |
        set -euo pipefail
        FRAMEWORK_PATH="${FRAMEWORK_PATH:-cicd/pipeline}"
        if [ -f "${FRAMEWORK_PATH}/scripts/bootstrap-framework.sh" ]; then
          # shellcheck disable=SC1090
          source "${FRAMEWORK_PATH}/scripts/bootstrap-framework.sh"
        else
          echo "ERROR: Framework not found at ${FRAMEWORK_PATH}"
          exit 1
        fi
        echo "STAGE=${STAGE:?}"
        echo "SERVICE_NAME=${SERVICE_NAME:?}"
        echo "ARTIFACT_BUCKET=${ARTIFACT_BUCKET:?}"

  build:
    commands:
      - |
        set -euo pipefail
        "${CICD_SCRIPTS_DIR}/run-build.sh"
        source "${CICD_FRAMEWORK_DIR:-${CICD_SCRIPTS_DIR:-.}/..}/scripts/promote-exported-variables.sh" \
          "${CODEBUILD_SRC_DIR:-.}/deployment-decision.env" \
          DEPLOY_DATA DEPLOY_INFRA DEPLOY_APP CURRENT_COMMIT

  post_build:
    commands:
      - |
        set -euo pipefail
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Build phase failed; not promoting CodePipeline variables."
        else
          source "${CICD_FRAMEWORK_DIR:-${CICD_SCRIPTS_DIR:-.}/..}/scripts/promote-exported-variables.sh" \
            "${CODEBUILD_SRC_DIR:-.}/deployment-decision.env" \
            DEPLOY_DATA DEPLOY_INFRA DEPLOY_APP CURRENT_COMMIT
        fi
        # CodePipeline OutputArtifacts.BuildArtifact requires a buildspec artifacts
        # payload. Immutable packages remain in s3://$ARTIFACT_BUCKET/$SERVICE_NAME/<commit>/.
        SRC_DIR="${CODEBUILD_SRC_DIR:-.}"
        FRAMEWORK_PATH="${FRAMEWORK_PATH:-cicd/pipeline}"
        printf 'CURRENT_COMMIT=%s\n' "${CURRENT_COMMIT:-unknown}" > "${SRC_DIR}/codepipeline-artifact.txt"
        if [ ! -f "${SRC_DIR}/deployment-decision.env" ]; then
          printf '# deployment-decision.env was not produced\n' > "${SRC_DIR}/deployment-decision.env"
        fi
        if [ -n "${CICD_FRAMEWORK_DIR:-}" ] && [ ! -d "${SRC_DIR}/${FRAMEWORK_PATH}/scripts" ] && [ -d "${CICD_FRAMEWORK_DIR}/scripts" ]; then
          mkdir -p "${SRC_DIR}/${FRAMEWORK_PATH}"
          cp -R "${CICD_FRAMEWORK_DIR}/." "${SRC_DIR}/${FRAMEWORK_PATH}/"
        fi
        if [ ! -d "${SRC_DIR}/${FRAMEWORK_PATH}" ]; then
          mkdir -p "${SRC_DIR}/${FRAMEWORK_PATH}"
          printf 'placeholder\n' > "${SRC_DIR}/${FRAMEWORK_PATH}/.codepipeline-placeholder"
        fi

# Required for CodePipeline BuildArtifact. Do not omit: missing artifacts lets
# the Build action succeed without writing the pipeline artifact store object.
artifacts:
  files:
    - codepipeline-artifact.txt
    - deployment-decision.env
    - cicd/pipeline/**/*
  discard-paths: no
