version: 0.2
# Reference buildspec: Deploy-Data
# Preflight → CREATE/UPDATE via deploy-data, or prepare IMPORT recovery.
# RECOVERY_REQUIRED exits 0 with exported recovery variables for approval.
#
# Inline CloudFormation BuildSpec must stay in sync with this file.
# RECOVERY_CHANGE_SET_NAME is listed for recovery exports; promote treats it
# as optional unless RECOVERY_REQUIRED=true.

env:
  shell: bash
  exported-variables:
    - DATA_ACTION
    - DATA_REASON
    - RECOVERY_REQUIRED
    - RECOVERY_CHANGE_SET_NAME
    - RECOVERY_STACK_NAME
    - RECOVERY_TABLE_NAME
    - RECOVERY_STAGE
    - CURRENT_COMMIT

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail
        FRAMEWORK_PATH="${FRAMEWORK_PATH:-cicd/pipeline}"
        source "${FRAMEWORK_PATH}/scripts/bootstrap-framework.sh"
        echo "STAGE=${STAGE:?} SERVICE_NAME=${SERVICE_NAME:?}"
        echo "CURRENT_COMMIT=${CURRENT_COMMIT:?}"
        echo "DATA_TABLE_NAME=${DATA_TABLE_NAME:-<from Data artifact>}"

  build:
    commands:
      - "${CICD_SCRIPTS_DIR}/run-deploy-data.sh"

  post_build:
    commands:
      - |
        set -euo pipefail
        FRAMEWORK_PATH="${FRAMEWORK_PATH:-cicd/pipeline}"
        source "${FRAMEWORK_PATH}/scripts/bootstrap-framework.sh"
        "${CICD_SCRIPTS_DIR}/stage-data-preflight-artifact.sh"
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Build phase failed; not promoting CodePipeline variables."
        else
          source "${CICD_SCRIPTS_DIR}/promote-exported-variables.sh" \
            "${CODEBUILD_SRC_DIR:-.}/data-deployment-variables.env" \
            DATA_ACTION RECOVERY_REQUIRED CURRENT_COMMIT \
            RECOVERY_STACK_NAME RECOVERY_TABLE_NAME RECOVERY_STAGE DATA_REASON \
            RECOVERY_CHANGE_SET_NAME
        fi

# Required for CodePipeline DataPreflightArtifact. Use a non-hidden
# base-directory so CodeBuild globbing cannot miss the payload.
# Optional recovery env is copied only when present.
artifacts:
  files:
    - '**/*'
  base-directory: pipeline-data-preflight
