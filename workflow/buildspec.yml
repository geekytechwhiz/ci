version: 0.2
# Service buildspec. Invokes the service-owned packaging hook only.

env:
  shell: bash
  exported-variables:
    - DEPLOY_DATA
    - DEPLOY_INFRA
    - DEPLOY_APP
    - CURRENT_COMMIT
  variables:
    STAGE: 'dev'
    AWS_REGION: 'us-east-1'
    STACK_NAME: 'dev-workflow-service'
    DATA_STACK_NAME: 'dev-workflow-service-data'
    INFRA_STACK_NAME: 'dev-workflow-service-infra'
    DATA_LOGICAL_ID: 'WorkflowTable'
    NODE_OPTIONS: '--max-old-space-size=2048'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Service npm install runs in ci/build.sh (workflow/package.json, including serverless-esbuild)."

  build:
    commands:
      - |
        set -euo pipefail
        chmod +x ci/build.sh
        ci/build.sh
        if [ -f deployment-decision.env ]; then
          set -a
          source deployment-decision.env
          set +a
          export DEPLOY_DATA DEPLOY_INFRA DEPLOY_APP CURRENT_COMMIT
        fi

  post_build:
    commands:
      - |
        set -euo pipefail
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Build phase failed."
          exit 1
        fi
        test -s data/packaged.yaml
        test -s infra/packaged.yaml
        test -s app/packaged.yaml

artifacts:
  files:
    - data/packaged.yaml
    - data/.serverless/**/*
    - infra/packaged.yaml
    - infra/.serverless/**/*
    - app/packaged.yaml
    - app/.serverless/**/*
    - ci/**/*
    - deployment-decision.env
  discard-paths: no
