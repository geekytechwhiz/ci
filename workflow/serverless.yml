service: workflow-service

configValidationMode: warn

frameworkVersion: '3.x'

# Shared plugin set + offline (shared plugins.yml omits offline; keep it for local DX).
plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  # - serverless-offline
  - '@myvitalrx/mvrx-resource-registry'

package: ${file(../infra/serverless/package.yml)}

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  # Preserve existing CloudFormation stack identity (do not rename to *-app).
  stackName: ${self:provider.stage}-workflow-service
  versionFunctions: false

   
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: ${self:custom.logRetentionByStage.${self:provider.stage}, '14'}

  environment: ${file(./config/runtime-${self:provider.stage}.yml)}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless
    Stack: application

  iamRoleStatements:
    - ${file(./config/permissions/dynamodb.yml)}
    - ${file(./config/permissions/dynamodb-stream.yml)}
    - ${file(./config/permissions/sqs.yml)}
    - ${file(./config/permissions/eventbridge.yml)}
    - ${file(../infra/serverless/permissions/ssm-read.yml)}
    - ${file(../infra/serverless/permissions/xray.yml)}

custom:
  sharedSsmPaths: ${file(../infra/serverless/config/shared-ssm-paths.yml)}
  logRetentionByStage: ${file(../infra/serverless/config/log-retention-by-stage.yml)}
  app: ${file(./config/app-custom.yml)}
  apiTitle: Workflow Service API

  resourceRegistry:
    enabled: true
    platformOwner: workflow-service
    parameters:
      WORKFLOW_EVENTS_QUEUE_URL:
        value: '{{resolve:ssm:/${self:provider.stage}/workflow-service/SQS_QUEUE_URL}}'
      LAMBDA_LOG_RETENTION_DAYS:
        value: ${self:custom.logRetentionByStage.${self:provider.stage}, '14'}

  sourcemapsByStage: ${file(../infra/serverless/config/sourcemaps-by-stage.yml)}
  keepNamesByStage: ${file(../infra/serverless/config/keep-names-by-stage.yml)}
  esbuild: ${file(../infra/serverless/config/esbuild.yml)}
  autoswagger: ${file(../infra/serverless/config/autoswagger-base.yml)}
  serverless-offline: ${file(../infra/serverless/config/serverless-offline.yml)}

functions:
  api:
    handler: src/handlers/http.main
    description: HTTP health endpoint for CI/CD pipeline validation
    events:
      - http:
          path: /health
          method: get
          cors: true
          summary: Health check
          responses:
            '200': OK

  events:
    handler: src/handlers/events.main
    description: SQS consumer for EventBridge → SQS event flow
    timeout: 30
    memorySize: 256
    events:
      - sqs:
          arn: '{{resolve:ssm:/${self:provider.stage}/workflow-service/SQS_QUEUE_ARN}}'
          batchSize: 5
          functionResponseType: ReportBatchItemFailures

resources:
  - ${file(./config/resources/gateway-responses.yml)}
