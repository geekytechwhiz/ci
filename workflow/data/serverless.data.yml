service: workflow-service-data

configValidationMode: error

frameworkVersion: '3.x'

# Data-only stack.
# Owns the POC DynamoDB table and data SSM parameters.
# No Lambda, API Gateway, SQS, SNS, EventBridge, or application plugins.

plugins:
  - ../ci/plugins/allow-nodejs22-runtime.js

provider:
  name: aws
  # Unused: this stack has no functions. Kept schema-valid and consistent with
  # the application Node.js 22 runtime contract.
  runtime: nodejs22.x
  region: ${env:AWS_REGION, opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  stackName: ${self:provider.stage}-workflow-service-data
  versionFunctions: false
  deploymentBucket:
    name: ${self:provider.stage}-workflow-service-bucket
    serverSideEncryption: AES256
  tags:
    Service: workflow-service
    Stage: ${self:provider.stage}
    ManagedBy: serverless
    Stack: data

custom:
  naming: ${file(../config/naming.yml)}
  tableName: ${self:custom.naming.tableName}

resources:
  - ${file(./resources/data.yml)}
