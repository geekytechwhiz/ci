Resources:
# Logical ID must stay WorkflowTable. Recovery IMPORT identifies the retained
 
  # Retain: deleting the Data stack must not delete production table data.
  WorkflowTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: nvdev-use1-mvx-workflow-service-db
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Service
          Value: workflow-service
        - Key: Stage
          Value: ${self:provider.stage}
        - Key: Purpose
          Value: WorkflowTable
        - Key: ManagedBy
          Value: serverless

  # Deployment-contract / derived references (not retained table data).
  # Default DeletionPolicy is Delete: removing the Data stack deletes these
  # parameters. App and Validate-SSM read them; Infra does not.
  # Recovery recreates them during the normal full Data stack UPDATE after
  # WorkflowTable has been imported. Do not add Retain merely to solve recovery.
  WorkflowTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: ${self:custom.naming.ssmPrefix}/TABLE_NAME
      Type: String
      Description: Workflow Service DynamoDB table name
      Value: !Ref WorkflowTable
      Tags:
        Service: workflow-service
        Stage: ${self:provider.stage}

  WorkflowTableArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: ${self:custom.naming.ssmPrefix}/TABLE_ARN
      Type: String
      Description: Workflow Service DynamoDB table ARN
      Value: !GetAtt WorkflowTable.Arn
      Tags:
        Service: workflow-service
        Stage: ${self:provider.stage}

  WorkflowTableStreamArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: ${self:custom.naming.ssmPrefix}/STREAM_ARN
      Type: String
      Description: Workflow Service DynamoDB stream ARN
      Value: !GetAtt WorkflowTable.StreamArn
      Tags:
        Service: workflow-service
        Stage: ${self:provider.stage}
