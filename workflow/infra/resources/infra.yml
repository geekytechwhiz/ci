Resources:
  WorkflowEventsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: ${self:custom.naming.queueName}
      VisibilityTimeout: 180
      ReceiveMessageWaitTimeSeconds: 20
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Service
          Value: workflow-service
        - Key: Stage
          Value: ${self:provider.stage}
        - Key: Purpose
          Value: WorkQueue
        - Key: ManagedBy
          Value: serverless

  WorkflowEventsQueueUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: ${self:custom.naming.ssmPrefix}/SQS_QUEUE_URL
      Type: String
      Description: Workflow events queue URL
      Value:
        Ref: WorkflowEventsQueue
      Tags:
        Service: workflow-service
        Stage: ${self:provider.stage}

  WorkflowEventsQueueArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: ${self:custom.naming.ssmPrefix}/SQS_QUEUE_ARN
      Type: String
      Description: Workflow events queue ARN
      Value:
        Fn::GetAtt:
          - WorkflowEventsQueue
          - Arn
      Tags:
        Service: workflow-service
        Stage: ${self:provider.stage}

  # Named custom bus. If a previous stack left this physical name behind,
  # adopt it with a one-time IMPORT — do not Create/Delete/Rename to pass deploy.
  WorkflowEventsBus:
    Type: AWS::Events::EventBus
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: custom bus for workflow-service events; named for app env contract; import existing physical bus x recreate
        must:
          - keep Name stable; ARN is the app/SSM contract
          - if CFN state lost, IMPORT the existing bus; x Delete+Create or rename
        mutable: must-never-change
        mutability:
          Name: must-never-change
    Properties:
      Name: ${self:custom.naming.eventBusName}
      Tags:
        - Key: Service
          Value: workflow-service
        - Key: Stage
          Value: ${self:provider.stage}
        - Key: Purpose
          Value: EventBus
        - Key: ManagedBy
          Value: serverless

  WorkflowEventsToQueueRule:
    Type: AWS::Events::Rule
    Properties:
      Name: ${self:custom.naming.eventRuleName}
      Description: Forward workflow-service events from the service bus to SQS
      EventBusName: !Ref WorkflowEventsBus
      EventPattern:
        source:
          - workflow-service
      State: ENABLED
      Targets:
        - Id: WorkflowEventsQueue
          Arn: !GetAtt WorkflowEventsQueue.Arn

  WorkflowEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref WorkflowEventsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeSendMessage
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt WorkflowEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt WorkflowEventsToQueueRule.Arn

  WorkflowEventsBusNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: ${self:custom.naming.ssmPrefix}/EVENT_BUS_NAME
      Type: String
      Description: Workflow events EventBridge bus name
      Value: !Ref WorkflowEventsBus
      Tags:
        Service: workflow-service
        Stage: ${self:provider.stage}

  WorkflowEventsBusArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: ${self:custom.naming.ssmPrefix}/EVENT_BUS_ARN
      Type: String
      Description: Workflow events EventBridge bus ARN
      Value: !GetAtt WorkflowEventsBus.Arn
      Tags:
        Service: workflow-service
        Stage: ${self:provider.stage}
