service: workflow-service-infra

configValidationMode: warn

frameworkVersion: '3.x'

# Infrastructure-only. No Lambda, API Gateway, or application plugins.
# Do not enable mvrx-resource-registry: it would publish SSM under a different path.

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION, opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  stackName: ${self:provider.stage}-workflow-service-infra
  versionFunctions: false
  deploymentBucket:
    name: ${self:provider.stage}-mibc-workflow-service-bucket
    serverSideEncryption: AES256
  tags:
    Service: workflow-service
    Stage: ${self:provider.stage}
    ManagedBy: serverless
    Stack: infrastructure

custom:
  naming: ${file(../config/naming.yml)}
  infra: ${file(../config/infra-${self:provider.stage}.yml)}

resources:
  - ${file(./resources/infra.yml)}
