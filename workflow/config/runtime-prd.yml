REGION: ${self:provider.region}
STAGE: ${self:provider.stage}
NODE_ENV: ${self:provider.stage}
SERVICE_NAME: workflow-service
LOG_LEVEL: warn
AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

WORKFLOW_EVENTS_QUEUE_URL: '{{resolve:ssm:${self:custom.naming.ssmPrefix}/SQS_QUEUE_URL}}'
WORKFLOW_TABLE: '{{resolve:ssm:${self:custom.naming.ssmPrefix}/TABLE_NAME}}'
USER_TABLE: '{{resolve:ssm:${self:custom.sharedSsmPaths.${self:provider.stage}.userTableName}}}'
WORKFLOW_EVENT_BUS_NAME: '{{resolve:ssm:${self:custom.naming.ssmPrefix}/EVENT_BUS_NAME}}'
WORKFLOW_EVENT_SOURCE: workflow-service
WORKFLOW_OUTBOX_RELAY_BATCH_SIZE: '10'
WORKFLOW_OUTBOX_POST_PUBLISH_MODE: markPublished

CARE_PLAN_RUNTIME_BASE_URL: '{{resolve:ssm:${self:custom.deploymentContext.${self:provider.stage}.carePlanRuntimeBaseUrl}}}'
INTERNAL_SERVICE_TOKEN: '{{resolve:ssm:${self:custom.sharedSsmPaths.${self:provider.stage}.internalServiceToken}}}'
