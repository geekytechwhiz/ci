service:
  name: workflow-service
  root: workflow

source:
  repository: OfficialOrg/api-hub
  branch: main
  ciPath: workflow/ci

deployment:
  data: true
  infrastructure: true
  application: true

data:
  enabled: true
  type: dynamodb
  logicalId: WorkflowTable

features:
  dynamodb: true
  sqs: true
  lambda: true
  apiGateway: true

ssm:
  required:
    - TABLE_NAME
    - TABLE_ARN
    - STREAM_ARN
    - SQS_QUEUE_URL
    - SQS_QUEUE_ARN
    - EVENT_BUS_NAME
    - EVENT_BUS_ARN

application:
  healthCheckPath: /health
  healthResponseContains: '"status": "healthy"'

changeDetection:
  data:
    - workflow/data/**
  infrastructure:
    - workflow/infra/**
  application:
    - workflow/src/**
    - workflow/serverless.yml
    - workflow/config/**
  ci:
    - workflow/ci/**
    - workflow/package.json
