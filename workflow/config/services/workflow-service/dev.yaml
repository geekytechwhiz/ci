service:
  name: workflow-service
  root: workflow

source:
  repository: MyvitalRx/
  branch: dev
  connectionArn: ""
  ciPath: workflow/ci

deployment:
  data: true
  infrastructure: true
  application: true

data:
  enabled: true
  type: dynamodb
  logicalId: WorkflowTable
  tableName: workflow-service-dev
  ownershipTags:
    Service: workflow-service
    Purpose: primaryDataTable
    ManagedBy: serverless

features:
  dynamodb: true
  sqs: true
  lambda: true
  apiGateway: true

ssm:
  prefix: /dev/workflow-service
  required:
    - TABLE_NAME
    - TABLE_ARN
    - STREAM_ARN
    - SQS_QUEUE_URL
    - SQS_QUEUE_ARN

application:
  healthCheckPath: /health
  apiBaseUrlParameter: /dev/workflow-service/api-base-url
  healthResponseContains: '"status": "healthy"'
  smokeTest: required
  buildProjectName: ""

changeDetection:
  data:
    - workflow/data/**
  infrastructure:
    - workflow/infrastructure/**
  application:
    - workflow/src/**
    - workflow/serverless.yml
    - workflow/config/**
  ci:
    - workflow/ci/**
    - workflow/package.json
    - workflow/buildspec.yml