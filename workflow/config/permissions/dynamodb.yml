Effect: Allow
Action:
  - dynamodb:GetItem
  - dynamodb:PutItem
  - dynamodb:UpdateItem
  - dynamodb:DeleteItem
  - dynamodb:Query
  - dynamodb:BatchGetItem
  - dynamodb:TransactWriteItems
  - dynamodb:DescribeTable
