Effect: Allow
Action:
  - dynamodb:GetItem
  - dynamodb:PutItem
  - dynamodb:UpdateItem
  - dynamodb:DeleteItem
  - dynamodb:Query
  - dynamodb:BatchGetItem
  - dynamodb:TransactWriteItems
  - dynamodb:DescribeTable
Resource:
  - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.naming.tableName}
  - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.naming.tableName}/index/*
